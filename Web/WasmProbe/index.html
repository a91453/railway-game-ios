<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railway Game Wasm 探針</title>
<style>
  body { font: 16px system-ui; max-width: 60rem; margin: 3rem auto; padding: 0 1rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #eee; padding: 1rem; }
</style>
<h1>Railway Game Wasm 探針</h1>
<p>在 Web Worker 執行 Swift GameCore，檢查遊戲規則與現有 golden scenarios。</p>
<p id="status">正在執行…</p>
<pre id="result" aria-live="polite"></pre>
<script type="module">
  const worker = new Worker('./worker.mjs', { type: 'module' });
  const finish = result => {
    clearTimeout(timeout);
    worker.terminate();
    window.probeResult = result;
    document.querySelector('#status').textContent = result.ok ? '執行通過' : '執行失敗';
    document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
  };
  const timeout = setTimeout(() => finish({ ok: false, error: 'Worker timeout (60s)' }), 60_000);
  worker.onmessage = event => finish(event.data);
  worker.onerror = event => finish({ ok: false, error: event.message });
  worker.postMessage({ run: true });
</script>
</html>
