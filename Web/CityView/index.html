<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Procedural Tokyo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1220; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px; max-width: 340px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: #262c57; /* Along the Line: the game's look */
        background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(38, 44, 87, 0.14); border-radius: 12px; pointer-events: none; white-space: pre;
      }
      /* Along the Line: one credit line at the bottom, in the middle, as on the game's real-world maps: between the
         switch on the left and the website link on the right (each clear of the notch), as wide as its words and
         no wider than the room it has */
      :root {
        --edge-left: max(12px, env(safe-area-inset-left)); --edge-right: max(12px, env(safe-area-inset-right));
        --edge-bottom: max(12px, env(safe-area-inset-bottom)); --controls-bottom: var(--edge-bottom);
      }
      #credits {
        position: fixed; bottom: max(6px, env(safe-area-inset-bottom));
        left: calc(var(--edge-left) + 80px); right: calc(var(--edge-right) + 120px); margin: 0 auto; width: fit-content;
        box-sizing: border-box; padding: 1px 5px; border-radius: 4px;
        font: 11px/1.4 -apple-system, system-ui, "PingFang TC", sans-serif; text-align: center; color: rgba(60, 60, 67, 0.75);
        background: rgba(255, 255, 255, 0.7); pointer-events: none;
      }
      #credits:empty { display: none; }
      /* (a long line breaks between the sources, each with its dot, and inside one only when it alone is too wide) */
      #credits span { display: inline-block; max-width: 100%; }
      /* a narrow screen (a phone held upright): the credits take the whole bottom row, the switch and the website
         link sit above them */
      @media (max-width: 699px) {
        :root { --controls-bottom: calc(max(6px, env(safe-area-inset-bottom)) + 44px); }
        #credits { left: var(--edge-left); right: var(--edge-right); }
      }
      /* Along the Line: the game's website, where jeantimex's GitHub link was (the app opens it in Safari) */
      #website {
        position: fixed; right: var(--edge-right); bottom: var(--controls-bottom);
        display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 16px;
        font: 600 12px -apple-system, system-ui, "PingFang TC", sans-serif; color: #262c57; text-decoration: none;
        background: rgba(255, 255, 255, 0.85); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      }
      #website img { width: 22px; height: 22px; border-radius: 6px; }
      /* the switch between the city as it is and its abstract model: a picture of the one it changes to */
      #mode {
        position: fixed; left: 12px; bottom: 12px; width: 68px; height: 68px; padding: 0; border: 2px solid #fff; border-radius: 12px; cursor: pointer;
        background: #cfd6dc center / cover no-repeat; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45); transition: box-shadow 0.12s ease;
      }
      /* (live: the picture is drawn by the scene itself, under the switch — which is then only its frame) */
      #mode.live { background: none !important; }
      #mode:hover { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55), 0 3px 12px rgba(0, 0, 0, 0.6); }
      #mode:active { border-color: #d6e4ff; }
      /* Along the Line: the settings panel (lil-gui) and the info panel in the game's look (docs/UI_THEME.md): a white
         panel, navy text, teal controls, round corners; clear of the notch (viewport-fit=cover) */
      :root .lil-gui {
        --background-color: rgba(255, 255, 255, 0.96); --text-color: #262c57;
        --title-background-color: #ffffff; --title-text-color: #262c57;
        --widget-color: rgba(38, 44, 87, 0.07); --hover-color: rgba(38, 44, 87, 0.13); --focus-color: rgba(13, 118, 106, 0.25);
        --number-color: #0d766a; --string-color: #0d766a;
        --font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; --font-size: 13px; --input-font-size: 13px;
        --widget-height: 28px; --padding: 10px; --spacing: 6px; --widget-border-radius: 8px; --slider-knob-width: 3px;
        --folder-indent: 8px; --scrollbar-width: 5px;
      }
      :root .lil-gui.lil-root {
        top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
        max-height: calc(100% - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); width: 280px;
        border: 1px solid rgba(38, 44, 87, 0.14); border-radius: 18px; overflow: hidden; box-shadow: 0 6px 24px rgba(38, 44, 87, 0.22);
      }
      :root .lil-gui.lil-root > .lil-title { height: 40px; font-size: 15px; font-weight: 700; padding: 0 14px; }
      :root .lil-gui .lil-gui > .lil-title { font-weight: 700; }
      :root .lil-gui .lil-gui > .lil-title, :root .lil-gui .lil-title:before { color: #262c57; }
      :root .lil-controller.lil-number .lil-fill { background: rgba(13, 118, 106, 0.2); }
      :root .lil-gui input[type=checkbox] { background: rgba(38, 44, 87, 0.1); }
      :root .lil-gui input[type=checkbox]:checked { background: #0d766a; color: #ffffff; }
      :root .lil-gui .lil-controller button { background: rgba(13, 118, 106, 0.12); color: #0d766a; font-weight: 600; }
      /* (the scene draws the switch's picture inside it wherever it is: main.js reads its place) */
      #mode { left: var(--edge-left); bottom: var(--controls-bottom); }
      /* shown while a city loads: at start-up and when another city is chosen */
      #loader {
        position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #eceef6; color: #262c57; /* Along the Line: the game's logo and its website's colours (decision 152) */
        font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; transition: opacity 0.7s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .logo { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 0 0 1px rgba(38, 44, 87, 0.14); }
      #loader .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.15em; line-height: 1.3; text-align: center; }
      #loader .brand small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; letter-spacing: 0.025em; color: #5b6189; }
      #loader .city { margin-top: 6px; font-size: clamp(26px, 5vw, 44px); font-weight: 800; letter-spacing: 0.04em; }
      #loader .bar { width: min(360px, 60vw); height: 4px; border-radius: 2px; background: rgba(38, 44, 87, 0.12); overflow: hidden; }
      #loader .fill { height: 100%; width: 0%; background: #0d766a; transition: width 0.25s ease; }
      #loader .step { font-size: 12px; color: #5b6189; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="loader">
      <!-- Along the Line: the game's logo and name, not Tokyo's (decision 152) -->
      <img class="logo" src="/assets/ui/brand-mark.png" alt="" />
      <div class="brand">沿線<small>Along the Line</small></div>
      <div class="city"></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="step"></div>
    </div>
    <!-- Along the Line: the page's own scripts in a file, not inline, so the website's Content-Security-Policy can
         forbid inline scripts (decision 163): the city's name, the website link's language, the idle callbacks -->
    <script src="/boot.js"></script>
    <!-- the info panel: hidden until asked for (control panel: info panel) -->
    <div id="hud" style="display: none">loading…</div>
    <button id="mode" type="button" aria-label="Switch between the photorealistic city and the abstract model"></button>
    <a id="website" href="https://www.alongthelinegame.com">
      <img src="/assets/ui/brand-mark.png" alt="" /><span>Website</span>
    </a>
    <div id="credits"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
