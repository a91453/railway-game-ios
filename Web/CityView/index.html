<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedural Tokyo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1220; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px; max-width: 340px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: #e8ecf2;
        background: rgba(10, 14, 22, 0.66); border-radius: 6px; pointer-events: none; white-space: pre;
      }
      /* Along the Line: one credit line at the bottom, in the middle, as on the game's real-world maps */
      #credits {
        position: fixed; left: 50%; bottom: max(6px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        max-width: calc(100% - 220px); /* (clear of the switch on the left and the website on the right) */ width: max-content; box-sizing: border-box; padding: 1px 5px; border-radius: 4px;
        font: 11px/1.4 -apple-system, system-ui, "PingFang TC", sans-serif; text-align: center; color: rgba(60, 60, 67, 0.75);
        background: rgba(255, 255, 255, 0.7); pointer-events: none;
      }
      #credits:empty { display: none; }
      #credits span { white-space: nowrap; } /* (a long line breaks between the sources, not inside one) */
      /* Along the Line: the game's website, where jeantimex's GitHub link was (the app opens it in Safari) */
      #website {
        position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 16px;
        font: 600 12px -apple-system, system-ui, "PingFang TC", sans-serif; color: #262c57; text-decoration: none;
        background: rgba(255, 255, 255, 0.85); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      }
      #website img { width: 22px; height: 22px; border-radius: 6px; }
      /* the switch between the city as it is and its abstract model: a picture of the one it changes to */
      #mode {
        position: fixed; left: 12px; bottom: 12px; width: 68px; height: 68px; padding: 0; border: 2px solid #fff; border-radius: 12px; cursor: pointer;
        background: #cfd6dc center / cover no-repeat; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45); transition: box-shadow 0.12s ease;
      }
      /* (live: the picture is drawn by the scene itself, under the switch — which is then only its frame) */
      #mode.live { background: none !important; }
      #mode:hover { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55), 0 3px 12px rgba(0, 0, 0, 0.6); }
      #mode:active { border-color: #d6e4ff; }
      /* shown while a city loads: at start-up and when another city is chosen */
      #loader {
        position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #eceef6; color: #262c57; /* Along the Line: the game's logo and its website's colours (decision 152) */
        font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; transition: opacity 0.7s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .logo { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 0 0 1px rgba(38, 44, 87, 0.14); }
      #loader .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.15em; line-height: 1.3; text-align: center; }
      #loader .brand small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; letter-spacing: 0.025em; color: #5b6189; }
      #loader .city { margin-top: 6px; font-size: clamp(26px, 5vw, 44px); font-weight: 800; letter-spacing: 0.04em; }
      #loader .bar { width: min(360px, 60vw); height: 4px; border-radius: 2px; background: rgba(38, 44, 87, 0.12); overflow: hidden; }
      #loader .fill { height: 100%; width: 0%; background: #0d766a; transition: width 0.25s ease; }
      #loader .step { font-size: 12px; color: #5b6189; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="loader">
      <!-- Along the Line: the game's logo and name, not Tokyo's (decision 152) -->
      <img class="logo" src="/assets/ui/brand-mark.png" alt="" />
      <div class="brand">沿線<small>Along the Line</small></div>
      <div class="city"></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="step"></div>
    </div>
    <!-- Along the Line: the page's own scripts in a file, not inline, so the website's Content-Security-Policy can
         forbid inline scripts (decision 163): the city's name, the website link's language, the idle callbacks -->
    <script src="/boot.js"></script>
    <!-- the info panel: hidden until asked for (control panel: info panel) -->
    <div id="hud" style="display: none">loading…</div>
    <button id="mode" type="button" aria-label="Switch between the photorealistic city and the abstract model"></button>
    <a id="website" href="https://www.alongthelinegame.com">
      <img src="/assets/ui/brand-mark.png" alt="" /><span>Website</span>
    </a>
    <div id="credits"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
