<script>
'use strict';
const pack=JSON.parse(document.getElementById('asset-data').textContent);
const $=id=>document.getElementById(id);
const categories={railway:'鐵道',residential:'住宅',commercial:'商業',public:'公共建築',industrial:'工業物流',landscape:'公園綠地',props:'街景配件',ground:'道路鋪面'};
const flat=pack.assets.flatMap(sheet=>sheet.frames.map(frame=>({...frame,sheet})));
const byId=new Map(flat.map(f=>[f.id,f]));
let mode='sheets',scene=[],selected=null,counter=0;
$('total').textContent=`${pack.asset_count} 張透明 PNG 素材表 · ${pack.item_count} 個圖像項目 · 單一等角視角`;
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
function sprite(frame,width){const e=document.createElement('span');e.className='sprite';e.style.aspectRatio=frame.width+'/'+frame.height;e.style.setProperty('--ratio',frame.width/frame.height);if(frame.clip_polygon)e.style.clipPath='polygon('+frame.clip_polygon.map(([x,y])=>(x/frame.width*100)+'% '+(y/frame.height*100)+'%').join(',')+')';if(width)e.style.width=width+'px';const im=document.createElement('img');im.src=frame.sheet.file;im.alt='';im.draggable=false;im.loading='lazy';im.style.width=frame.sheet.width/frame.width*100+'%';im.style.height=frame.sheet.height/frame.height*100+'%';im.style.left=-frame.x/frame.width*100+'%';im.style.top=-frame.y/frame.height*100+'%';e.append(im);return e;}
function matches(sheet,frame){const cat=$('category').value,q=$('search').value.trim().toLowerCase();return(cat==='all'||sheet.category===cat)&&(!q||[sheet.name,sheet.id,categories[sheet.category],frame?.name,...(sheet.subjects||[])].filter(Boolean).join(' ').toLowerCase().includes(q));}
function makeChecks(frame){const box=document.createElement('div');box.className='checks';for(const [label,cls] of [['淺色面板','light-panel'],['深色面板','dark-panel'],['淺色地圖','light-map'],['深色地圖','dark-map']]){const row=document.createElement('div');row.className='check-row '+cls;row.append(text('span',label,'check-label'));for(const size of [120,64,44,28]){const col=document.createElement('div');col.append(sprite(frame,size),text('div',String(size),'check-label'));row.append(col);}for(const [label,filter] of [['模糊','blur(1.6px)'],['灰階','grayscale(1)']]){const col=document.createElement('div'),s=sprite(frame,64);s.style.filter=filter;col.append(s,text('div',label,'check-label'));row.append(col);}box.append(row);}return box;}
function render(){const g=$('gallery');g.replaceChildren();$('scene-panel').hidden=mode!=='scene';g.className=mode==='sheets'?'grid':'tile-grid';for(const m of ['sheets','items','scene'])$(m+'-tab').setAttribute('aria-pressed',String(mode===m));if(mode==='sheets'){const sheets=pack.assets.filter(a=>matches(a));$('results').textContent=`顯示 ${sheets.length} 張素材表`;for(const a of sheets){const card=document.createElement('article');card.className='card';const link=document.createElement('a');link.href=a.file;link.target='_blank';link.rel='noopener';const im=document.createElement('img');im.className='sheet canvas-bg';im.src=a.file;im.alt=a.name;im.loading='lazy';link.append(im);const info=document.createElement('div');info.className='info';info.append(text('h2',a.name),text('p',`${categories[a.category]} · ${a.columns} × ${a.rows} · ${a.items} 個項目`,'pill'));card.append(link,info);const details=document.createElement('details');details.append(text('summary','第一格：四種底色與尺寸檢查'));details.addEventListener('toggle',()=>{if(details.open&&!details.querySelector('.checks'))details.append(makeChecks({...a.frames[0],sheet:a}));});card.append(details);g.append(card);}}else{const frames=flat.filter(f=>matches(f.sheet,f));$('results').textContent=`顯示 ${frames.length} 個項目${mode==='scene'?' · 點選加入場景':''}`;for(const f of frames){const b=document.createElement('button');b.className='tile-button canvas-bg';b.dataset.assetId=f.id;b.append(sprite(f),text('span',f.name,'tile-name'));b.title=mode==='scene'?'加入場景：'+f.name:'檢查：'+f.name;b.addEventListener('click',()=>{if(mode==='scene')add(f.id);else{const d=document.createElement('dialog');d.style.cssText='max-width:95vw;border:1px solid #c9cedf;border-radius:14px;padding:16px';const close=text('button','關閉');close.addEventListener('click',()=>{d.close();d.remove();});d.append(text('h2',f.name),makeChecks(f),close);document.body.append(d);d.showModal();}});g.append(b);}}if(!g.children.length)g.append(text('p','找不到符合的素材。','empty'));}
function setMode(value){mode=value;render();}
for(const m of ['sheets','items','scene'])$(m+'-tab').addEventListener('click',()=>setMode(m));
for(const id of ['category','search'])$(id).addEventListener(id==='search'?'input':'change',render);
$('theme').addEventListener('click',()=>{$('theme').setAttribute('aria-pressed',String(document.body.classList.toggle('dark')));});
$('backdrop').addEventListener('change',()=>document.documentElement.style.setProperty('--tile',$('backdrop').value));
function add(assetId,copy){const n={instanceId:'object-'+(++counter),assetId,x:copy?copy.x+20:300+(scene.length%4)*25,y:copy?copy.y+20:150+(scene.length%4)*25,width:copy?copy.width:160};scene.push(n);selected=n.instanceId;renderScene();}
function select(id){selected=id;for(const e of $('scene').querySelectorAll('.scene-object'))e.classList.toggle('selected',e.dataset.instanceId===id);const n=scene.find(n=>n.instanceId===selected);for(const id of ['scale','front','back','duplicate','remove'])$(id).disabled=!n;if(n)$('scale').value=n.width;}
function renderScene(){const board=$('scene');board.replaceChildren();if(!scene.length)board.append(text('div','從下方選一個物件開始','scene-hint'));for(const [z,n] of scene.entries()){const frame=byId.get(n.assetId),el=document.createElement('button');el.type='button';el.className='scene-object';el.dataset.instanceId=n.instanceId;el.setAttribute('aria-label',frame.name);el.style.left=n.x/9+'%';el.style.top=n.y/5.6+'%';el.style.width=n.width/9+'%';el.style.zIndex=z+1;el.append(sprite(frame));el.addEventListener('pointerdown',event=>{event.preventDefault();select(n.instanceId);el.setPointerCapture(event.pointerId);const rect=board.getBoundingClientRect(),startX=event.clientX,startY=event.clientY,x=n.x,y=n.y;const move=e=>{n.x=Math.max(-n.width/2,Math.min(880,x+(e.clientX-startX)/rect.width*900));n.y=Math.max(-80,Math.min(540,y+(e.clientY-startY)/rect.height*560));el.style.left=n.x/9+'%';el.style.top=n.y/5.6+'%';};const stop=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',stop);el.removeEventListener('pointercancel',stop);};el.addEventListener('pointermove',move);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);});el.addEventListener('click',()=>select(n.instanceId));board.append(el);}select(selected);$('scene-status').textContent=`場景中有 ${scene.length} 個物件`;}
$('scale').addEventListener('input',()=>{const n=scene.find(n=>n.instanceId===selected);if(n){n.width=Number($('scale').value);renderScene();}});
$('remove').addEventListener('click',()=>{scene=scene.filter(n=>n.instanceId!==selected);selected=null;renderScene();});
$('duplicate').addEventListener('click',()=>{const n=scene.find(n=>n.instanceId===selected);if(n)add(n.assetId,n);});
for(const [id,toFront] of [['front',true],['back',false]])$(id).addEventListener('click',()=>{const i=scene.findIndex(n=>n.instanceId===selected);if(i>=0){const n=scene.splice(i,1)[0];toFront?scene.push(n):scene.unshift(n);renderScene();}});
$('clear').addEventListener('click',()=>{scene=[];selected=null;renderScene();});
function exportData(){return{schema_version:1,pack:'generated-2026-10-21-scene-kit',canvas:{width:900,height:560},objects:scene.map(n=>({...n,file:byId.get(n.assetId).sheet.file,frame:{x:byId.get(n.assetId).x,y:byId.get(n.assetId).y,width:byId.get(n.assetId).width,height:byId.get(n.assetId).height}}))};}
$('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='taiwan-scene.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('example').addEventListener('click',()=>{scene=pack.example_scene.objects.map(n=>({...n,instanceId:'object-'+(++counter)}));selected=null;renderScene();});
$('import').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async()=>{try{const file=$('import-file').files[0];if(!file)return;const d=JSON.parse(await file.text());if(d.schema_version!==1||d.pack!=='generated-2026-10-21-scene-kit'||d.canvas?.width!==900||d.canvas?.height!==560||!Array.isArray(d.objects)||d.objects.length>500)throw Error('請使用此素材包匯出的場景 JSON。');const imported=d.objects.map(n=>{if(!byId.has(n.assetId)||![n.x,n.y,n.width].every(Number.isFinite)||n.width<40||n.width>600||Math.abs(n.x)>2000||Math.abs(n.y)>2000)throw Error('物件座標或素材名稱無效。');return{instanceId:'object-'+(++counter),assetId:n.assetId,x:n.x,y:n.y,width:n.width};});scene=imported;selected=null;renderScene();}catch(error){$('scene-status').textContent='無法匯入：'+error.message;}finally{$('import-file').value='';}});
$('scene').addEventListener('keydown',event=>{const n=scene.find(n=>n.instanceId===selected);if(!n)return;const delta={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[event.key];if(delta){event.preventDefault();n.x+=delta[0];n.y+=delta[1];renderScene();$('scene').focus();}else if(event.key==='Delete'||event.key==='Backspace'){event.preventDefault();$('remove').click();$('scene').focus();}});
render();renderScene();
</script></body></html>
