name: Game Center Setup Checks

# Tests the Game Center setup tool (game-center-setup.yml and
# tools/game-center-setup/) with no Apple account and no secret: a fake App
# Store Connect on the runner itself and a throwaway key. Also checks that
# docs/GAME_CENTER_SETUP.md shows the same tables as
# docs/game-center/game-center.json. It cannot show that the real App Store
# Connect accepts the requests; only the owner's run of game-center-setup.yml
# can.
#
# Linux only. Runs on pull requests that change the tool, its data, its
# workflows or the TestFlight script whose token signing it reuses, and by
# hand (Actions -> Game Center Setup Checks -> Run workflow).

on:
  pull_request:
    paths:
      - .github/workflows/game-center-setup.yml
      - .github/workflows/game-center-setup-checks.yml
      - .github/scripts/testflight-processing.py
      - .github/scripts/testflight-selftest-processing.py
      - tools/game-center-setup/**
      - docs/game-center/**
      - docs/GAME_CENTER_SETUP.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-center-setup-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Game Center setup tool (lint, fake App Store Connect, tables)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      # actionlint also runs shellcheck on the workflows' `run:` blocks.
      - name: Lint the workflows
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/game-center-setup.yml .github/workflows/game-center-setup-checks.yml

      # A fake App Store Connect on 127.0.0.1 and a throwaway key.
      - name: Setup tool tests (fakes only) and the tables in GAME_CENTER_SETUP.md
        run: |
          python3 --version
          python3 -I tools/game-center-setup/test_game_center_setup.py
