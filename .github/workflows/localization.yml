name: App Localization

on:
  pull_request:
    paths:
      - "RailwayGameApp/**"
      - ".github/workflows/localization.yml"
      - ".github/scripts/check-localization*.py"
      - ".github/scripts/localization-fixtures/**"
  push:
    branches: [main]
    paths:
      - "RailwayGameApp/**"
      - ".github/workflows/localization.yml"
      - ".github/scripts/check-localization*.py"
      - ".github/scripts/localization-fixtures/**"

permissions:
  contents: read

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  localization:
    name: Traditional Chinese translations
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test localization checker
        run: python3 .github/scripts/check-localization-selftest.py

      - name: Export Swift strings with Xcode
        run: |
          xcodebuild -version
          # Export may synchronize catalogs. Check against the committed input,
          # not against any strings Xcode adds to the working copy during export.
          cp RailwayGameApp/Resources/Localizable.xcstrings "$RUNNER_TEMP/Localizable.xcstrings"
          xcodebuild -exportLocalizations \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -localizationPath "$RUNNER_TEMP/loc" \
            -exportLanguage zh-Hant \
            -destination "generic/platform=iOS Simulator" \
            -disableAutomaticPackageResolution \
            SWIFT_EMIT_LOC_STRINGS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Check zh-Hant targets and committed catalog keys
        run: |
          python3 .github/scripts/check-localization.py \
            --export "$RUNNER_TEMP/loc" \
            --catalog "$RUNNER_TEMP/Localizable.xcstrings"

      - name: Upload localization export for diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-export
          path: |
            ${{ runner.temp }}/loc
            ${{ runner.temp }}/Localizable.xcstrings
          if-no-files-found: ignore
          retention-days: 7
