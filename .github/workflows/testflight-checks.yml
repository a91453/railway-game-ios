name: TestFlight Checks

# Tests the TestFlight release workflow (testflight.yml) and its scripts with
# no Apple account and no secret: fake values only; nothing is signed with an
# Apple certificate and nothing is uploaded, and the processing check talks
# to a fake App Store Connect on the runner itself. It cannot show that real
# signing, upload or TestFlight processing work; see
# docs/TESTFLIGHT_GITHUB_ACTIONS.md for what is verified where.
#
# Runs on pull requests that change the release workflow, this workflow or
# the scripts or the What to Test text (the macOS dry run not for the text
# alone), and by hand (Actions -> TestFlight Checks -> Run workflow).

on:
  pull_request:
    paths:
      - .github/workflows/testflight.yml
      - .github/workflows/testflight-checks.yml
      - .github/scripts/testflight-*
      - .github/testflight-whats-new.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scripts:
    name: Scripts (lint, preflight, build numbers, retry, processing)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      # actionlint also runs shellcheck on every workflow `run:` block.
      - name: Lint scripts and workflows
        run: |
          shellcheck --version | head -n 2
          shellcheck .github/scripts/*.sh
          "$RUNNER_TEMP/actionlint"

      - name: Preflight and build-number tests (fake values)
        run: .github/scripts/testflight-selftest.sh

      - name: Retry tests (fake command and sleep)
        run: .github/scripts/testflight-selftest-retry.sh

      # Decision 1016: the archive goes to the upload job encrypted.
      - name: Archive hand-over tests (fake archive and secret)
        run: .github/scripts/testflight-selftest-bundle.sh

      # A fake App Store Connect and GitHub on 127.0.0.1, a throwaway key and
      # a throwaway git history.
      - name: Processing and What to Test tests (fakes only)
        run: |
          python3 --version
          python3 -I .github/scripts/testflight-selftest-processing.py

      # Decision 858: which map packs a release uploads again, on a
      # throwaway git history.
      - name: Map pack choice tests (throwaway repository)
        run: python3 -I .github/scripts/testflight-map-packs.py --selftest

  # The macOS dry run takes an unsigned archive (the longest check a pull
  # request has). A pull request that only rewrites the What to Test text
  # changes nothing it reads, so it runs only for the release workflow, this
  # workflow and the scripts; the text itself is checked by the Linux job.
  changes:
    name: Changes (does the macOS dry run need to run?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.detect.outputs.macos }}
    steps:
      # A pull request is checked out as its merge commit, whose first
      # parent is the base: two commits are enough to list its files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changes to the release workflow or its scripts
        id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          macos=true
          if [[ "$EVENT" == pull_request ]]; then
            if files="$(git diff --no-renames --name-only HEAD^1 HEAD)"; then
              echo "Changed files:"
              echo "$files"
              if ! grep -qE '^\.github/(workflows/testflight(-checks)?\.yml|scripts/testflight-)' <<<"$files"; then
                macos=false
              fi
            else
              echo "::warning::Could not list the changed files; running the macOS dry run."
            fi
          fi
          echo "macos=$macos" >>"$GITHUB_OUTPUT"
          echo "macOS dry run: $macos"

  macos-dry-run:
    name: macOS dry run (no Apple account; nothing signed or uploaded)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: xcode-27
    # Two unsigned archives: 7 and 5 minutes on 2026-10-14, 20 and 9 minutes
    # on 2026-11-07 (#1915, where 30 minutes stopped it before the IPA check),
    # 25 and 27 on 2026-11-15, 32 and more than 28 on 2026-11-18 (#2423,
    # where 60 minutes stopped it in the second archive). Since decision
    # 1016 one archive: the external scope rewrites only the options.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          openssl version

      - name: Keychain and API key file (fake key, failing step, cleanup)
        run: .github/scripts/testflight-selftest-macos.sh signing

      # The release runs testflight-retry.sh with this runner's bash.
      - name: Retry tests under the macOS runner's bash
        run: |
          bash --version | head -n 1
          .github/scripts/testflight-selftest-retry.sh

      # The steps below run the release workflow's own scripts in the order
      # testflight.yml does, minus the account: no key, an unsigned archive.
      - name: Record the keychains before setup
        run: |
          security list-keychains -d user >"$RUNNER_TEMP/keychains-before.txt"
          security default-keychain -d user >"$RUNNER_TEMP/default-keychain-before.txt"

      - name: Set up signing (no key)
        run: .github/scripts/testflight-signing.sh setup

      - name: Archive the committed project (unsigned, internal TestFlight)
        run: .github/scripts/testflight-archive.sh unsigned internal

      - name: Check internal TestFlight export options and Xcode tools
        env:
          TESTFLIGHT_SCOPE: internal
        run: .github/scripts/testflight-selftest-macos.sh tools

      # The archive does not depend on the scope, only the options do, so
      # the external scope rewrites the options for the same archive
      # (decision 1016: this was a second 28-minute archive).
      - name: Write the external TestFlight options for the same archive
        env:
          TESTFLIGHT_OPTIONS_ONLY: "1"
        run: .github/scripts/testflight-archive.sh unsigned external

      - name: Check external TestFlight export options and Xcode tools
        env:
          TESTFLIGHT_SCOPE: external
        run: .github/scripts/testflight-selftest-macos.sh tools

      # Decision 1016: the real (unsigned) archive through the same
      # encryption the archive job uses and back, with LibreSSL, bsdtar and
      # bash 3.2; it must come back file for file, links included.
      - name: Hand the archive over encrypted and back (fake secret)
        env:
          BUNDLE_SECRET: fake-secret-for-the-dry-run
        run: |
          digest() {
            (cd "$1" && find . \( -type f -o -type l \) | LC_ALL=C sort | while IFS= read -r f; do
              if [[ -L "$f" ]]; then echo "link $f $(readlink "$f")"; else echo "file $f $(shasum -a 256 <"$f" | cut -c1-64)"; fi
            done)
          }
          before="$(digest "$ARCHIVE_PATH"; shasum -a 256 <"$UPLOAD_OPTIONS")"
          sha="$(.github/scripts/testflight-bundle.sh pack "$RUNNER_TEMP/archive.bin")"
          echo "Encrypted archive: $(du -h "$RUNNER_TEMP/archive.bin" | cut -f1)."
          rm -rf "$ARCHIVE_PATH" "$UPLOAD_OPTIONS"
          .github/scripts/testflight-bundle.sh unpack "$RUNNER_TEMP/archive.bin" "$sha"
          after="$(digest "$ARCHIVE_PATH"; shasum -a 256 <"$UPLOAD_OPTIONS")"
          rm -f "$RUNNER_TEMP/archive.bin"
          if [[ "$before" != "$after" ]]; then
            echo "::error::The archive did not come back the same."
            diff <(echo "$before") <(echo "$after") | head -n 40
            exit 1
          fi
          echo "The archive came back file for file ($(wc -l <<<"$before") entries)."
          .github/scripts/testflight-selftest-bundle.sh

      - name: Simulate a failing release step
        id: simulated-failure
        continue-on-error: true
        run: |
          echo "This step fails on purpose; the cleanup below must still run and restore everything."
          exit 1

      - name: Clean up signing material
        if: always()
        run: .github/scripts/testflight-signing.sh cleanup

      - name: Check the cleanup
        env:
          SIMULATED_FAILURE: ${{ steps.simulated-failure.outcome }}
        run: |
          [[ "$SIMULATED_FAILURE" == failure ]] || { echo "::error::The simulated step did not fail."; exit 1; }
          diff "$RUNNER_TEMP/keychains-before.txt" <(security list-keychains -d user) ||
            { echo "::error::The keychain search list was not restored."; exit 1; }
          diff "$RUNNER_TEMP/default-keychain-before.txt" <(security default-keychain -d user) ||
            { echo "::error::The default keychain was not restored."; exit 1; }
          if [[ -e "$RUNNER_TEMP/testflight-state" || -e "$RUNNER_TEMP/testflight" ]]; then
            echo "::error::The temporary keychain, key file, archive or export folder was left behind."
            exit 1
          fi
          echo "Keychains restored; temporary keychain, archive and export options removed."

      - name: IPA check against synthetic IPAs
        run: .github/scripts/testflight-selftest-macos.sh ipa
