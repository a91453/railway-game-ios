name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift ${{ matrix.swift }} (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 6.0 is the minimum declared by Package.swift (swift-tools-version: 6.0);
        # 6.2.4 is the iPad / Swift Playgrounds compatibility target;
        # 6.4 is the current stable release.
        swift: ["6.0", "6.2.4", "6.4"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test
