name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift ${{ matrix.swift }} (Linux)
    runs-on: ubuntu-24.04
    # The full suite with every property campaign takes about 25 minutes
    # since Stage S5; the limit leaves room for the stages after it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 6.0 is the minimum declared by Package.swift (swift-tools-version: 6.0);
        # 6.4 is the current stable release. Releases between them (such as
        # the iPad Swift Playgrounds' 6.2) are not built separately.
        swift: ["6.0", "6.4"]
        # The property campaigns (generated sequences checked against the
        # reference models and saves) take most of the test time and check
        # logic, which does not depend on the compiler: they run on the
        # current release only. 6.0 still builds all targets and tests with
        # warnings as errors and runs every other test.
        include:
          - swift: "6.4"
            campaigns: true
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        if: matrix.campaigns
        run: swift test

      - name: Test (without the property campaigns)
        if: ${{ !matrix.campaigns }}
        run: swift test --skip 'PropertyTests|KernelDifferentialTests|SaveMutationTests'
