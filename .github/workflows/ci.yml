name: CI

# The Swift package (GameCore, GamePresentation and their tests) on Linux,
# with Swift 6.4 only: every target and test builds with warnings as errors,
# and every test runs, campaigns included. The campaigns are not reduced; they
# are split across parallel jobs (shards) so the wait is the slowest shard, not
# their sum. No other Swift release is built: the Swift 6.0 job (the minimum
# Package.swift declares) was removed on 2026-10-05.
#
# The shards, the proof that together they run every test exactly once, and the
# path filter live in .github/scripts/swift-shards.sh. The matrix below comes
# from that script, so a shard defined there always has a job.
#
# A pull request runs the tier its changed files need (decision 185,
# swift-shards.sh plan): everything for a change to GameCore, the package,
# the CI scripts, a shared test file or several edited campaigns; only the
# GamePresentation tests for a change there (or to the app's bundled data, or
# a tools/ file they read); only the classes that read
# the fixtures for a fixture change; only the classes a GameCore test file
# declares when no other file uses it. The label `full-ci` makes a pull
# request run everything: add it, then re-run the pull request's run (Re-run
# all jobs; the change detection reads the labels the pull request has
# then). A push to main and a manual run always run every shard
# (swift-shards.sh decide).
#
# On a pull request the gate also waits for the same commit's iOS App Build
# run and is red when that run fails (decision 265), so the one check main's
# branch rule requires covers the Xcode build and the UI test gate too.
#
# The workflow always starts, so the "Swift CI (gate)" check always reports
# (but on a cancelled push run of main, see the gate job):
# on a pull request or a push to main that changes nothing the package builds
# or tests (only docs, the app, the release workflows), the Swift jobs are
# skipped and the gate passes; otherwise the gate passes only when every
# Swift job of the tier passed. A push to main is compared with the head of
# the last successful push run of this workflow on main (swift-shards.sh
# push-base), not with the commit main was at before it: a commit whose run
# was replaced (see concurrency below) is then still tested by the next run,
# and after a red run every later run tests again until one passes. The
# branch rule of main (main-gate) requires the gate, "Swift CI (gate)": keep
# that name. Manual runs always run everything, and so does a push whose base
# cannot be found (no successful run, the API failing, a commit that is not
# an ancestor).

on:
  push:
    branches: [main]
  pull_request:
    # Not on labeled (until 2026-10-12 it was): adding any label started a
    # new run and cancelled the one in progress. To run a pull request in
    # full, add full-ci and re-run its run (decision 187).
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  # push-base reads the earlier runs of this workflow.
  actions: read
  # A pull request's labels (full-ci) are read when it runs, so a re-run
  # after the label is added sees it.
  pull-requests: read

# A newer push to a pull request cancels its older run. Pushes to main share
# one group and never cancel a running run: at most one runs and one waits,
# and a newer push replaces the waiting one, which GitHub shows as cancelled.
# A burst of merges therefore runs the run in progress and the newest one,
# not one each (2026-10-12: 9 merges in 70 minutes queued 9 runs of 17 jobs,
# and every pull request waited behind them). The cost: a replaced commit has
# no result of its own. The newest run still tests its changes (it is
# compared with the last success), but when it turns red, start this
# workflow by hand (workflow_dispatch) on the replaced commits to find which
# one broke it. Manual runs keep a group per commit.
#
# Rules for the people and sessions that merge (decision 187,
# docs/research/CI_INCIDENT_2026-10-12.md):
# - Never cancel a push run of main, by hand or from a session (`gh run
#   cancel` acts with the owner's token): this group already keeps a burst
#   of merges to the run in progress and the newest one, and on 2026-10-12
#   cancelling them wasted 729 runner-minutes and left ten commits with a red
#   gate and no failing test. To free runners, cancel pull request runs.
# - Merge main into a pull request only when it conflicts or needs something
#   on main (main's rule does not require an up-to-date branch), one pull
#   request at a time, just before it is merged; never into every open pull
#   request at once. Push a change when it is ready, not piece by piece.
# - Merge in batches of 3 to 5 green pull requests, then wait for this
#   workflow to turn green on main before the next batch. Keep at most 2
#   pull requests that change GameCore running CI at once (a full tier is 18
#   jobs of the account's 40).
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}', github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes (does the Swift package need testing?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.detect.outputs.swift }}
      tier: ${{ steps.detect.outputs.tier }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      # On a pull request depth 2 is enough: the checkout is the pull request
      # merged into its base, whose two parents are both fetched. A push to
      # main needs the history back to its base (push-base checks that it is
      # an ancestor); commits and trees only, no file contents, which the
      # file list does not need.
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          filter: ${{ github.event_name == 'push' && 'blob:none' || '' }}

      - name: Detect Swift-relevant changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          base=""
          listed=false
          if [[ "$EVENT" == pull_request ]]; then
            # The first parent of the merge commit is the base, so this is
            # what the pull request changes.
            base=HEAD^1
          elif [[ "$EVENT" == push ]]; then
            # The head of the last successful push run: this run tests
            # everything since, including the commits whose runs were
            # replaced or failed.
            base="$(.github/scripts/swift-shards.sh push-base)" || base=""
            if [[ -n "$base" ]]; then
              echo "Compared with $base, the head of the last successful push run of ci.yml on main." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # If the changed files cannot be read, test.
          if [[ -z "$base" && "$EVENT" != workflow_dispatch ]]; then
            echo "::warning::No earlier commit to compare with; running the Swift jobs."
          elif [[ -n "$base" ]]; then
            # No rename detection: it would read file contents, and a
            # renamed file then lists both its names.
            if files="$(git diff --no-renames --name-only "$base" HEAD)"; then
              listed=true
              echo "Changed files:"
              echo "$files"
            else
              echo "::warning::Could not list the changed files; running the Swift jobs."
            fi
          fi
          labels=""
          if [[ "$EVENT" == pull_request ]]; then
            # Labels as the pull request has them now (a re-run sees a label
            # added since), and as the event had them if that cannot be read.
            labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name' 2>/dev/null || true) $EVENT_LABELS"
          fi
          # Each file's tier and the tests chosen go to the log.
          decision="$(LISTED="$listed" LABELS="$labels" .github/scripts/swift-shards.sh decide <<<"${files:-}")"
          echo "$decision" >> "$GITHUB_OUTPUT"
          swift="$(sed -n 's/^swift=//p' <<<"$decision")"
          tier="$(sed -n 's/^tier=//p' <<<"$decision")"
          if [[ "$swift" == true ]]; then
            echo "Swift jobs: run, tier $tier (event: $EVENT)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Swift jobs: skipped, no changed file can change what the package builds or tests." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The shard script is what proves the Swift jobs ran every test once;
      # this shows, without Swift, that its checks fail when they should.
      - name: Self-test the shard script
        if: steps.detect.outputs.swift == 'true'
        run: .github/scripts/swift-shards-selftest.sh

  swift-current:
    name: Swift 6.4 (Linux) / ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-24.04
    # The slowest shard takes about 9 minutes of tests on a fast runner and
    # up to about 16 on a slow one (see the table in swift-shards.sh); the
    # limit leaves room for campaigns to grow before a shard is split further.
    timeout-minutes: 20
    container: swift:6.4-noble
    strategy:
      # The shards are independent: let every one finish so a failing run
      # shows all its failures at once.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      # The test step warns when the job nears its timeout (decision 404).
      - name: Note the job's start
        run: echo "JOB_STARTED=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      # swift build --build-tests -Xswiftc -warnings-as-errors, built once
      # more when swift-build itself is killed by a signal (decision 329); a
      # compile error is not built again.
      - name: Build (warnings as errors)
        run: .github/scripts/swift-shards.sh build

      # Runs this shard's tests and fails unless exactly those tests ran.
      # A partial tier's job is `selected` (SELECTED_TESTS, and its part of
      # them); a full run's are the shards.
      - name: Test (shard ${{ matrix.shard }})
        run: .github/scripts/swift-shards.sh run "$SHARD"
        env:
          SHARD: ${{ matrix.tests && 'selected' || matrix.shard }}
          SELECTED_TESTS: ${{ matrix.tests }}
          SELECTED_PART: ${{ matrix.part }}
          # One test at a time. swift test --parallel runs each test in a
          # process of its own, so a class's shared fixture is built once per
          # test, not once per class: on #1189's full run campaigns-11 passed
          # 20 minutes (decision 404).
          SWIFT_TEST_WORKERS: 1

  # A cancelled pull request run: was it replaced by a newer push? Then the
  # newer run gives the verdict and the gate is skipped here, not red on a
  # commit no test failed on (decision 329). A run cancelled by hand on the
  # pull request's head is not superseded and keeps its red gate.
  superseded:
    name: Superseded by a newer push?
    needs: [changes, swift-current]
    if: ${{ cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      superseded: ${{ steps.look.outputs.superseded }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Look at the pull request's head
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/swift-shards.sh superseded | tee -a "$GITHUB_OUTPUT"

  gate:
    name: Swift CI (gate)
    needs: [changes, swift-current, superseded]
    # A push run of main that was cancelled (by hand, or replaced while
    # waiting) has no verdict to give, so the gate is skipped there rather
    # than red on a commit where no test failed; the next push run tests its
    # changes (push-base). A shard that reaches its time limit does not
    # cancel the run, so it still turns the gate red. A pull request run
    # that a newer push replaced is skipped too (the superseded job,
    # decision 329); a pull request run cancelled any other way, and a
    # manual run, keep always(): their gate reports even when cancelled
    # (decision 187).
    if: ${{ always() && !(cancelled() && (github.event_name == 'push' || needs.superseded.outputs.superseded == 'true')) }}
    runs-on: ubuntu-24.04
    # A pull request's gate also waits for its iOS App Build run (below):
    # the macOS queue (up to about 35 minutes on 2026-10-16) and the build
    # job's own 60-minute limit.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 120 || 5 }}
    steps:
      # Only the script; the verdict is swift-shards.sh gate, which the
      # self-test checks.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Check the Swift jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          SWIFT_NEEDED: ${{ needs.changes.outputs.swift }}
          TIER: ${{ needs.changes.outputs.tier }}
          CURRENT: ${{ needs.swift-current.result }}
        run: .github/scripts/swift-shards.sh gate

      # On a pull request the gate is also red until ios-build.yml's run of
      # the same commit has passed (decision 265): main's branch rule
      # requires this check alone, and a pull request merged automatically
      # or by hand as soon as it turned green went in before its Xcode build
      # and UI tests had finished (#746, 2026-10-16). A change the app cannot
      # see has no iOS run and passes at once. After a failed iOS run is
      # re-run and passes, re-run this gate too (Re-run failed jobs). Pushes
      # to main and manual runs do not wait: their full lane is
      # ios-full-lane.yml's.
      - name: Wait for this change's iOS App Build
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/swift-shards.sh ios-gate
