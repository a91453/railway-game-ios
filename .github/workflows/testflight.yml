name: TestFlight

# Archives the committed project on a GitHub-hosted macOS runner, exports an
# App Store distribution IPA signed through App Store Connect with the
# team's API key, checks it, then uploads the archive, exported the same
# way, to App Store Connect for TestFlight testing. The manual run chooses
# whether the uploaded build is internal-only or external-capable. Export
# and upload use xcodebuild with the API key; the archive is signed ad hoc by
# default (see archive_signing). Both are tried again when they fail, so a
# dropped connection to Apple does not cost the archive. A Linux job then
# waits for App Store Connect to process the build, reports the result, and
# fills the build's What to Test with the pull requests merged since the
# last release.
#
# Started only by hand (Actions -> TestFlight -> Run workflow) and
# only from main. Pull requests never run it; its secrets live in the
# "testflight" environment, which only main may use. Setup, the required
# secrets and variables, and what is verified: docs/TESTFLIGHT_GITHUB_ACTIONS.md.
# The same scripts are exercised without an Apple account by
# testflight-checks.yml.

on:
  workflow_dispatch:
    inputs:
      archive_signing:
        description: >-
          How the archive is signed before export. "adhoc" (default): the
          archive is signed ad hoc, so it needs no development certificate
          or provisioning profile; use it for a CI or new team with no
          registered development device. It is not the type of the final
          IPA: the App Store distribution signing and profile are still
          applied when the archive is exported, and the IPA check verifies
          them. "automatic": automatic development signing with the API key
          at archive time; it needs a development provisioning profile,
          which Apple can create only if the team has a registered device.
        type: choice
        options:
          - adhoc
          - automatic
        default: adhoc
      testing_scope:
        description: >-
          TestFlight distribution scope. "internal" marks the build as internal-only.
          "external" uploads an external-capable build that can be added to an
          External Testing group and submitted to Beta App Review.
        type: choice
        options:
          - internal
          - external
        default: internal

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight (branch and settings)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Fails in seconds, listing every missing or malformed setting, before
      # a macOS runner starts. Prints no secret.
      - name: Check branch and settings
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-preflight.sh

  release:
    name: Archive, sign, export, check and upload
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    # One release at a time: a second run's release job waits instead of
    # uploading in parallel, and a running upload is never cancelled. Only
    # this job: waiting for Apple's processing does not hold up the next one.
    concurrency:
      group: testflight-release
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}
      version: ${{ steps.ipa.outputs.version }}
      upload_started: ${{ steps.upload-start.outputs.started }}
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ARCHIVE_SIGNING: ${{ inputs.archive_signing }}
      TESTING_SCOPE: ${{ inputs.testing_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same check again, and BUILD_NUMBER for later steps. It is
      # computed here, from this job's own run attempt, so that re-running
      # only the failed jobs still gets a build number no attempt has used.
      - name: Check settings and set the build number
        id: build
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-preflight.sh

      # App Store Connect accepts only builds made with Xcode 26 or later.
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if (( major < 26 )); then
            echo "::error::App Store Connect needs Xcode 26 or later; this runner has Xcode $major."
            exit 1
          fi

      - name: Set up signing (temporary keychain and API key file)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-signing.sh setup

      - name: Archive (Release, generic iOS device)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: .github/scripts/testflight-archive.sh "$ARCHIVE_SIGNING" "$TESTING_SCOPE"

      # Automatic signing for App Store Connect distribution; with no local
      # distribution certificate, xcodebuild uses the team's cloud-managed one.
      # That talks to Apple, so a failed export is tried again (run #48 lost
      # its archive to "The network connection was lost.").
      - name: Sign and export the IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          RETRY_CLEAN="$EXPORT_PATH" .github/scripts/testflight-retry.sh "Export" \
            xcodebuild -quiet -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Checks a local IPA exported from the same archive and signing options
      # that the upload step reuses.
      - name: Check the IPA
        id: ipa
        run: |
          shopt -s nullglob
          ipas=("$EXPORT_PATH"/*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo "::error::Expected one IPA in the export folder, found ${#ipas[@]}."
            exit 1
          fi
          archived="$ARCHIVE_PATH/Info.plist"
          EXPECTED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$archived")"
          EXPECTED_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$archived")"
          export EXPECTED_BUNDLE_ID EXPECTED_VERSION
          EXPECTED_BUILD="$BUILD_NUMBER" EXPECTED_TEAM_ID="$APPLE_TEAM_ID" \
            .github/scripts/testflight-verify-ipa.sh "${ipas[0]}"
          {
            echo "bundle_id=$EXPECTED_BUNDLE_ID"
            echo "version=$EXPECTED_VERSION"
          } >>"$GITHUB_OUTPUT"

      # From here on App Store Connect may have the build, even if the upload
      # step fails (a retried upload that Apple refuses as a duplicate), so
      # the processing job looks for it.
      - name: Mark the upload as started
        id: upload-start
        run: echo "started=true" >>"$GITHUB_OUTPUT"

      # Runs only after the IPA check passed. It re-exports the same archive
      # with the same signing options; only destination changes to upload
      # (supported with API keys since Xcode 15). Tried again when it fails.
      - name: Upload to App Store Connect
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ steps.ipa.outputs.bundle_id }}
          VERSION: ${{ steps.ipa.outputs.version }}
        run: |
          RETRY_CLEAN="$TESTFLIGHT_DIR/upload" .github/scripts/testflight-retry.sh "Upload" \
            xcodebuild -quiet -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$TESTFLIGHT_DIR/upload" \
            -exportOptionsPlist "$UPLOAD_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo ""
            echo "Uploaded $BUNDLE_ID $VERSION ($BUILD_NUMBER) for $TESTING_SCOPE TestFlight. App Store Connect now processes it (the processing job below waits for it); it appears in TestFlight when processing ends:"
            echo "https://appstoreconnect.apple.com/apps/$ASC_APP_ID/testflight/ios"
          } >>"$GITHUB_STEP_SUMMARY"

      # Runs even when an earlier step failed or the run was cancelled.
      - name: Clean up signing material
        if: always()
        run: .github/scripts/testflight-signing.sh cleanup

  # Linux, so the wait costs no macOS runner. It also runs after a failed
  # upload step once the upload started: App Store Connect may have the build
  # anyway. Re-running only this job checks the same build again.
  processing:
    name: Wait for App Store Connect processing, fill What to Test
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.upload_started == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: testflight
    permissions:
      contents: read
      # The last successful run of this workflow, and pull request titles.
      actions: read
      pull-requests: read
    steps:
      # main's whole history, for the merges since the last release; only
      # .github is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: .github

      - name: List the changes since the last release (What to Test)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          python3 .github/scripts/testflight-changes.py >"$RUNNER_TEMP/whats-new.txt"
          cat "$RUNNER_TEMP/whats-new.txt"

      # Without the list, it still waits and reports; What to Test stays empty.
      - name: Wait for App Store Connect processing and fill What to Test
        if: ${{ !cancelled() }}
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: python3 .github/scripts/testflight-processing.py --whats-new "$RUNNER_TEMP/whats-new.txt"
