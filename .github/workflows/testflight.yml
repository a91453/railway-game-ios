name: TestFlight

# Archives the committed project on a macOS runner, exports an App Store
# distribution IPA signed through App Store Connect with the team's API key,
# checks it, then uploads the archive, exported the same way, to App Store
# Connect for TestFlight testing. The manual run chooses whether the
# uploaded build is internal-only or external-capable. Export and upload use
# xcodebuild with the API key; the archive is signed ad hoc by default (see
# archive_signing). Both are tried again when they fail, so a dropped
# connection to Apple does not cost the archive. A Linux job then waits for
# App Store Connect to process the build, reports the result, and fills the
# build's What to Test with the pull requests merged since the last release.
#
# Decision 1016: the archive, the map packs and the build upload are three
# jobs, so a failure is re-run alone (Re-run failed jobs), and they run on
# the owner's Mac when its release runner is online and free, otherwise on
# the hosted xcode-27 image (pick-mac.yml, label chien-mac-release).
#
# Started only by hand (Actions -> TestFlight -> Run workflow) and
# only from main. Pull requests never run it; its secrets live in the
# "testflight" environment, which only main may use. Setup, the required
# secrets and variables, and what is verified: docs/TESTFLIGHT_GITHUB_ACTIONS.md.
# The same scripts are exercised without an Apple account by
# testflight-checks.yml.

on:
  workflow_dispatch:
    inputs:
      archive_signing:
        description: >-
          How the archive is signed before export. "adhoc" (default): the
          archive is signed ad hoc, so it needs no development certificate
          or provisioning profile; use it for a CI or new team with no
          registered development device. It is not the type of the final
          IPA: the App Store distribution signing and profile are still
          applied when the archive is exported, and the IPA check verifies
          them. "automatic": automatic development signing with the API key
          at archive time; it needs a development provisioning profile,
          which Apple can create only if the team has a registered device.
        type: choice
        options:
          - adhoc
          - automatic
        default: adhoc
      testing_scope:
        description: >-
          TestFlight distribution scope. "internal" marks the build as internal-only.
          "external" uploads an external-capable build that can be added to an
          External Testing group and submitted to Beta App Review.
        type: choice
        options:
          - internal
          - external
        default: internal
      map_packs:
        description: >-
          Which map packs (asset packs) are uploaded. "changed" (default):
          only a city's pack that differs from the last successful release's,
          since every upload is a new version App Store Connect reviews.
          "all": every pack, whatever changed.
        type: choice
        options:
          - changed
          - all
        default: changed
      carry_map_packs:
        description: >-
          Whether the app carries every map pack whole. "no" (default): only
          each city's pack.json, so a city is there once its pack has
          downloaded from App Store Connect (0.6.0 (152.1.1) showed the
          download, and removing and downloading again, work; DEBUG-150).
          "yes": the app is some 140 MB larger and a city whose download
          does not come is still played.
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight (branch and settings)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Fails in seconds, listing every missing or malformed setting, before
      # a macOS runner starts. Prints no secret.
      - name: Check branch and settings
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-preflight.sh

      # The released game's name (tools/brand/README.md): a release without
      # it would be the neutral game, so a missing or malformed secret fails
      # here, before a macOS runner starts.
      - name: Check the game's brand
        uses: ./.github/actions/apply-brand
        with:
          brand: ${{ secrets.GAME_BRAND_JSON }}
          required: "true"

  # Decision 1016: the owner's Mac takes the macOS jobs when its release
  # runner (label chien-mac-release, a macOS account of its own that pull
  # requests never use) is online and free; otherwise the hosted xcode-27
  # image does, as before. pick-mac.yml says which and why in its summary.
  pick:
    name: Pick the Mac or a hosted runner
    needs: preflight
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pick-mac.yml
    with:
      allow: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
      label: chien-mac-release
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # Decision 1016: the release is three jobs, so a failure re-runs only its
  # own part (Re-run failed jobs): this one archives, signs, exports and
  # checks; map-packs uploads the map packs at the same time; upload sends
  # the build once both have passed. Run 148 was stopped at 45 minutes while
  # it uploaded the map packs after a 41-minute archive, all in one job.
  archive:
    name: Archive, sign, export and check
    needs: pick
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on || '"xcode-27"') }}
    # Run 147's archive took 35 minutes and run 148's 41 on a hosted runner.
    # 90 leaves room for a slow one.
    timeout-minutes: 90
    environment: testflight
    permissions:
      contents: read
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}
      bundle_id: ${{ steps.ipa.outputs.bundle_id }}
      version: ${{ steps.ipa.outputs.version }}
      bundle_sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ARCHIVE_SIGNING: ${{ inputs.archive_signing }}
      TESTING_SCOPE: ${{ inputs.testing_scope }}
      CARRY_MAP_PACKS_INPUT: ${{ inputs.carry_map_packs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # The same check again, and BUILD_NUMBER for later steps. It is
      # computed here, from this job's own run attempt, so that re-running
      # only the failed jobs still gets a build number no attempt has used.
      - name: Check settings and set the build number
        id: build
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-preflight.sh

      # From April 2027 App Store Connect accepts only builds made with the
      # iOS 27 SDK, Xcode 27 or later (its warning 90725 on build 139, which
      # Xcode 26.6 made; decision 857). The check is below, after the brand.
      # The released game's name, save extension, website and mailbox into
      # the working copy the archive is built from (tools/brand/README.md).
      - name: Apply the game's brand
        uses: ./.github/actions/apply-brand
        with:
          brand: ${{ secrets.GAME_BRAND_JSON }}
          required: "true"

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if (( major < 27 )); then
            echo "::error::App Store Connect needs Xcode 27 or later from April 2027; this runner has Xcode $major."
            exit 1
          fi

      - name: Set up signing (temporary keychain and API key file)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-signing.sh setup

      - name: Archive (Release, generic iOS device)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: .github/scripts/testflight-archive.sh "$ARCHIVE_SIGNING" "$TESTING_SCOPE"

      # Automatic signing for App Store Connect distribution; with no local
      # distribution certificate, xcodebuild uses the team's cloud-managed one.
      # That talks to Apple, so a failed export is tried again (run #48 lost
      # its archive to "The network connection was lost.").
      - name: Sign and export the IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          RETRY_CLEAN="$EXPORT_PATH" .github/scripts/testflight-retry.sh "Export" \
            xcodebuild -quiet -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Checks a local IPA exported from the same archive and signing options
      # that the upload job reuses.
      - name: Check the IPA
        id: ipa
        run: |
          shopt -s nullglob
          ipas=("$EXPORT_PATH"/*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo "::error::Expected one IPA in the export folder, found ${#ipas[@]}."
            exit 1
          fi
          archived="$ARCHIVE_PATH/Info.plist"
          EXPECTED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$archived")"
          EXPECTED_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$archived")"
          export EXPECTED_BUNDLE_ID EXPECTED_VERSION
          EXPECTED_BUILD="$BUILD_NUMBER" EXPECTED_TEAM_ID="$APPLE_TEAM_ID" \
            .github/scripts/testflight-verify-ipa.sh "${ipas[0]}"
          {
            echo "bundle_id=$EXPECTED_BUNDLE_ID"
            echo "version=$EXPECTED_VERSION"
          } >>"$GITHUB_OUTPUT"

      # Decision 1016: the checked archive and the upload options, encrypted
      # (this repository's artifacts are public; testflight-bundle.sh), for
      # the upload job. Kept 3 days: re-running only the upload job the next
      # day still finds it.
      - name: Encrypt the archive for the upload job
        id: pack
        env:
          BUNDLE_SECRET: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          sha="$(.github/scripts/testflight-bundle.sh pack "$TESTFLIGHT_DIR/archive.bin")"
          echo "sha256=$sha" >>"$GITHUB_OUTPUT"
          echo "Encrypted archive: $(du -h "$TESTFLIGHT_DIR/archive.bin" | cut -f1), SHA-256 $sha."

      - name: Hand the encrypted archive to the upload job
        uses: actions/upload-artifact@v7
        with:
          name: testflight-archive-encrypted
          path: ${{ env.TESTFLIGHT_DIR }}/archive.bin
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true

      # Runs even when an earlier step failed or the run was cancelled.
      - name: Clean up signing material
        if: always()
        run: .github/scripts/testflight-signing.sh cleanup

      # The owner's Mac keeps the working copy between jobs: put the brand
      # back to the neutral name there (a hosted runner is thrown away).
      - name: Remove the brand from the working copy (the Mac)
        if: always() && runner.environment == 'self-hosted'
        run: |
          git reset --hard --quiet
          git clean -ffdxq

  # Decision 776: the cities' map packs, uploaded apart from the build as
  # Apple-hosted asset packs (tools/asset-packs/). Decision 858: the app
  # carries none of their files, so a pack that has to be uploaded and is
  # not stops the release: the upload job needs this one. App Store Connect
  # makes a new version at every upload, the same files or not, and each
  # version is reviewed, so only a pack that differs from the last
  # successful release's is uploaded (testflight-map-packs.py);
  # `map_packs: all` uploads every one. DEBUG-138: before the build, so App
  # Store Connect has processed a changed pack by the time the build comes
  # out (0.6.0 (138) was out minutes before its new Hong Kong pack, and the
  # owner's iPhone kept 137's). Decision 1016: its own job, beside the
  # archive, so a failed pack upload is re-run without archiving again.
  map-packs:
    name: Upload the map packs that changed
    needs: pick
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on || '"xcode-27"') }}
    timeout-minutes: 45
    environment: testflight
    permissions:
      contents: read
      # Decision 858: the last successful run of this workflow, whose map
      # packs App Store Connect has (testflight-map-packs.py).
      actions: read
    # One map pack upload at a time, never cancelled.
    concurrency:
      group: testflight-map-packs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # Only the API key file is used here; the keychain comes with it.
      - name: Set up the API key file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-signing.sh setup

      - name: Upload the map packs that changed (asset packs)
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MAP_PACKS: ${{ inputs.map_packs }}
        run: |
          if [[ "$MAP_PACKS" == "all" ]]; then
            changed="$(python3 -I .github/scripts/testflight-map-packs.py --all)"
          else
            changed="$(python3 -I .github/scripts/testflight-map-packs.py)"
          fi
          if [[ -z "$changed" ]]; then
            echo "The map packs are the same as at the last release; none was uploaded." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          packs="$TESTFLIGHT_DIR/asset-packs"
          # shellcheck disable=SC2086 # one ID a word
          tools/asset-packs/package.sh "$packs" $changed
          for id in $changed; do
            API_PRIVATE_KEYS_DIR="$(dirname "$ASC_KEY_PATH")" xcrun altool --upload-asset-pack "$packs/$id.aar" \
              --apple-id "$ASC_APP_ID" --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"
            echo "Uploaded a new version of the map pack $id. Before external testers or the App Store get this build, submit that version for review with it in App Store Connect." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Map packs::A new version of $id was uploaded; it is reviewed with the build."
          done

      - name: Clean up the key file
        if: always()
        run: .github/scripts/testflight-signing.sh cleanup

  # Decision 1016: sends the archive the archive job checked, once the map
  # packs it needs are on App Store Connect (decision 858, DEBUG-138).
  # Re-running only this job uses the same archive and build number.
  upload:
    name: Upload the build to App Store Connect
    needs: [pick, archive, map-packs]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on || '"xcode-27"') }}
    timeout-minutes: 40
    environment: testflight
    permissions:
      contents: read
    # One build upload at a time: a second run's upload waits instead of
    # uploading in parallel, and a running upload is never cancelled. Only
    # this job: waiting for Apple's processing does not hold up the next one.
    concurrency:
      group: testflight-release
      cancel-in-progress: false
    outputs:
      upload_started: ${{ steps.upload-start.outputs.started }}
    env:
      BUILD_NUMBER: ${{ needs.archive.outputs.build_number }}
      TESTING_SCOPE: ${{ inputs.testing_scope }}
    steps:
      # Only the scripts: the archive is already built and branded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up signing (temporary keychain and API key file)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: .github/scripts/testflight-signing.sh setup

      - name: Fetch the encrypted archive
        uses: actions/download-artifact@v8
        with:
          name: testflight-archive-encrypted
          path: ${{ runner.temp }}/testflight-download

      - name: Check and decrypt the archive
        env:
          BUNDLE_SECRET: ${{ secrets.ASC_PRIVATE_KEY }}
          SHA256: ${{ needs.archive.outputs.bundle_sha256 }}
        run: |
          .github/scripts/testflight-bundle.sh unpack "$RUNNER_TEMP/testflight-download/archive.bin" "$SHA256"
          rm -rf "$RUNNER_TEMP/testflight-download"

      # From here on App Store Connect may have the build, even if the upload
      # step fails (a retried upload that Apple refuses as a duplicate), so
      # the processing job looks for it.
      - name: Mark the upload as started
        id: upload-start
        run: echo "started=true" >>"$GITHUB_OUTPUT"

      # The archive job's IPA check passed (this job needs it). It re-exports
      # the same archive with the same signing options; only destination
      # changes to upload (supported with API keys since Xcode 15). Tried
      # again when it fails.
      - name: Upload to App Store Connect
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ needs.archive.outputs.bundle_id }}
          VERSION: ${{ needs.archive.outputs.version }}
        run: |
          RETRY_CLEAN="$TESTFLIGHT_DIR/upload" .github/scripts/testflight-retry.sh "Upload" \
            xcodebuild -quiet -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$TESTFLIGHT_DIR/upload" \
            -exportOptionsPlist "$UPLOAD_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo ""
            echo "Uploaded $BUNDLE_ID $VERSION ($BUILD_NUMBER) for $TESTING_SCOPE TestFlight. App Store Connect now processes it (the processing job below waits for it); it appears in TestFlight when processing ends:"
            echo "https://appstoreconnect.apple.com/apps/$ASC_APP_ID/testflight/ios"
          } >>"$GITHUB_STEP_SUMMARY"

      # Runs even when an earlier step failed or the run was cancelled.
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/testflight-download"
          .github/scripts/testflight-signing.sh cleanup

  # Linux, so the wait costs no macOS runner. It also runs after a failed
  # upload step once the upload started: App Store Connect may have the build
  # anyway. Re-running only this job checks the same build again.
  processing:
    name: Wait for App Store Connect processing, fill What to Test
    needs: [archive, upload]
    if: ${{ !cancelled() && needs.upload.outputs.upload_started == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: testflight
    permissions:
      contents: read
      # The last successful run of this workflow, and pull request titles.
      actions: read
      pull-requests: read
    steps:
      # main's whole history, for the merges since the last release; only
      # .github is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: .github

      - name: List the changes since the last release (What to Test)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          python3 .github/scripts/testflight-changes.py >"$RUNNER_TEMP/whats-new.txt"
          cat "$RUNNER_TEMP/whats-new.txt"

      # Without the list, it still waits and reports; What to Test stays empty.
      - name: Wait for App Store Connect processing and fill What to Test
        if: ${{ !cancelled() }}
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ needs.archive.outputs.build_number }}
          APP_VERSION: ${{ needs.archive.outputs.version }}
        run: python3 .github/scripts/testflight-processing.py --whats-new "$RUNNER_TEMP/whats-new.txt"
