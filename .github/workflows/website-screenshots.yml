# Screenshots for the game's website (ARCHITECTURE decision 165): builds the
# Debug app, runs RailwayGameUITests/WebsiteScreenshotTests on an iPhone
# Simulator on its side, in dark mode as the website's screenshots are, and
# uploads what the tests kept as PNGs in the `website-screenshots` artifact.
# The website's own tools/screens.py turns them into its WebP sizes.
#
# By hand only, from the Actions tab: choose the branch (a pull request's
# own branch to take a change's screenshots). It tests nothing: the gate and
# the full lane (ios-build.yml) skip these tests. Until 2026-10-12 a pull
# request that changed the screenshot tests, their scenes or this file also
# ran it, holding one of the account's five macOS runners for 13 to 24
# minutes a run (decision 187).
#
# Input `kind` = promo (decision 475) takes the material for a promotional
# video instead: RailwayGameUITests/PromoMaterialTests, one test at a time,
# the Simulator's screen recorded around each (`simctl io recordVideo`,
# H.264), screenshots at the device's own size, on an iPhone or an iPad
# (`device`), dark and/or light (`appearance`; the recording only in the
# first). It is one artifact, `promo-material`, with PNGs under
# <appearance>/, MP4s under video/ and a manifest. Press it on a branch of
# your own, one run at a time: the macOS runners are shared.
name: Website screenshots

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "website: the website's screenshots; promo: material for a promotional video"
        type: choice
        options: [website, promo]
        default: website
      device:
        description: "iphone (a Pro), ipad (promo only) or iphone-small (the smallest iPhone, to check the tools fit)"
        type: choice
        options: [iphone, ipad, iphone-small]
        default: iphone
      appearance:
        description: "promo only: dark, light or both (the recording is of the first)"
        type: choice
        options: [dark, light, both]
        default: dark
      tests:
        description: "PromoMaterialTests (promo) or WebsiteScreenshotTests (website) methods, separated by spaces or commas (empty: all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: website-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshots (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: ${{ inputs.kind == 'promo' && 340 || 60 }}
    steps:
      - uses: actions/checkout@v7

      # The website's screenshots are from an iPhone Pro (2622 × 1206 on
      # its side): the first available Pro that is not a Max, else the first
      # iPhone. `device` = iphone-small (100.1, decision 509; the planner's
      # merge condition) takes the narrowest iPhone in points instead, a
      # mini before an SE of the same width (less room on its side), to see
      # that the tools column fits there; the log lists every iPhone with
      # its size.
      - name: Select a Simulator
        env:
          PROMO_DEVICE: ${{ (inputs.kind == 'promo' || inputs.device == 'iphone-small') && inputs.device || 'iphone' }}
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          xcrun simctl list devicetypes --json > "$RUNNER_TEMP/devicetypes.json"
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          devices = json.loads(Path(os.environ["RUNNER_TEMP"], "simulators.json").read_text())["devices"]
          wanted = os.environ["PROMO_DEVICE"]
          kind = "iPad" if wanted == "ipad" else "iPhone"
          iphones = [device for runtime, group in devices.items()
                     if ".iOS-" in runtime for device in group
                     if device["isAvailable"] and device["name"].startswith(kind)]
          if not iphones:
              raise SystemExit(f"No available {kind} Simulator")
          if wanted == "iphone-small":
              # The screen in points, from the device type's profile.
              sizes = {}
              for devicetype in json.loads(Path(os.environ["RUNNER_TEMP"], "devicetypes.json").read_text())["devicetypes"]:
                  try:
                      profile = plistlib.loads(Path(devicetype["bundlePath"], "Contents/Resources/profile.plist").read_bytes())
                      scale = profile["mainScreenScale"]
                      sizes[devicetype["identifier"]] = (profile["mainScreenWidth"] / scale, profile["mainScreenHeight"] / scale)
                  except (KeyError, OSError, plistlib.InvalidFileException, ZeroDivisionError):
                      pass
              for d in iphones:
                  print(f"{d['name']}: {sizes.get(d.get('deviceTypeIdentifier'), '?')}")
              sized = [d for d in iphones if d.get("deviceTypeIdentifier") in sizes]
              if not sized:
                  raise SystemExit("No iPhone Simulator with a known screen size")
              device = min(sized, key=lambda d: (min(sizes[d["deviceTypeIdentifier"]]), "mini" not in d["name"]))
          else:
              # An iPhone Pro that is not a Max; an iPad Pro (the largest).
              pros = [d for d in iphones if d["name"].endswith(" Pro")] if kind == "iPhone" \
                  else [d for d in iphones if d["name"].startswith("iPad Pro")]
              device = (pros or iphones)[-1]
          print(f"Selected {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_UDID={device['udid']}\n")
              env.write(f"SIMULATOR_NAME={device['name']}\n")
          PY

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO

      # Dark, with the status bar a clean 9:41 should it show.
      - name: Boot the Simulator in dark mode
        timeout-minutes: 14
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || echo "::warning::Could not set the status bar"

      - name: Take the screenshots
        id: screenshots
        if: inputs.kind != 'promo'
        timeout-minutes: 30
        env:
          WEBSITE_TESTS: ${{ inputs.tests }}
        run: |
          # An empty `tests` input runs the whole class; a list of test names runs those.
          only=(-only-testing:RailwayGameUITests/WebsiteScreenshotTests)
          if [[ -n "$WEBSITE_TESTS" ]]; then
            only=()
            IFS=', ' read -r -a names <<<"$WEBSITE_TESTS"
            for name in "${names[@]}"; do only+=("-only-testing:RailwayGameUITests/WebsiteScreenshotTests/$name"); done
          fi
          xcodebuild test-without-building \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/screenshots.xcresult" \
            "${only[@]}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGN_IDENTITY=-

      # Each kept attachment as <name>.png, whether or not every test passed.
      - name: Export the screenshots
        if: always() && inputs.kind != 'promo' && steps.screenshots.outcome != 'skipped'
        run: |
          out="$RUNNER_TEMP/attachments"
          mkdir -p "$out" "$RUNNER_TEMP/website-screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/screenshots.xcresult" --output-path "$out"
          python3 - <<'PY' || echo "::warning::Could not name the screenshots; the result bundle has them"
          import json, os, re, shutil
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"], "attachments")
          dest = Path(os.environ["RUNNER_TEMP"], "website-screenshots")
          manifest = json.loads((out / "manifest.json").read_text())
          # Only the tests' own screenshots, named in lower case with
          # hyphens: XCTest's own attachments (failure screenshots, debug
          # descriptions with quotes in their names) stay in the result bundle.
          pattern = re.compile(r"^([a-z0-9-]+)_\d+_")
          for test in manifest:
              for attachment in test.get("attachments", []):
                  exported = attachment["exportedFileName"]
                  match = pattern.match(attachment.get("suggestedHumanReadableName", ""))
                  if not match or not exported.endswith(".png"):
                      continue
                  target = dest / f"{match.group(1)}.png"
                  shutil.copy(out / exported, target)
                  print(f"{test.get('testIdentifier', '?')}: {target.name}")
          PY
          # The screen's screenshot is the display as it is built, upright:
          # a phone on its side comes out turned a quarter. Turn it back, a
          # quarter anticlockwise (sips turns clockwise).
          for shot in "$RUNNER_TEMP"/website-screenshots/*.png; do
            [[ -e "$shot" ]] || continue
            width=$(sips -g pixelWidth "$shot" | awk '/pixelWidth/ { print $2 }')
            height=$(sips -g pixelHeight "$shot" | awk '/pixelHeight/ { print $2 }')
            if (( width < height )); then
              sips -r 270 "$shot" >/dev/null
            fi
          done
          ls -l "$RUNNER_TEMP/website-screenshots"

      - name: Upload the screenshots
        if: always() && inputs.kind != 'promo' && steps.screenshots.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: website-screenshots
          path: ${{ runner.temp }}/website-screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the result bundle
        if: failure() && inputs.kind != 'promo'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: website-screenshots-xcresult
          path: ${{ runner.temp }}/screenshots.xcresult
          if-no-files-found: warn
          retention-days: 7

      # Decision 475. One xcodebuild run per test, so that each test has a
      # recording of its own; a test that fails (a screen that moved) keeps
      # the pictures it already took, and the next test still runs.
      - name: Take the promo material
        id: promo
        if: inputs.kind == 'promo'
        timeout-minutes: 320
        env:
          PROMO_TESTS: ${{ inputs.tests }}
          PROMO_APPEARANCE: ${{ inputs.appearance }}
        run: |
          set -u
          root="$RUNNER_TEMP/promo"
          mkdir -p "$root/video" "$root/bundles" "$root/logs"
          if [[ -n "$PROMO_TESTS" ]]; then
            IFS=', ' read -r -a tests <<<"$PROMO_TESTS"
          else
            tests=($(grep -oE 'func test[A-Za-z0-9]+\(' RailwayGameApp/UITests/PromoMaterialTests.swift | sed -E 's/func (.*)\(/\1/'))
          fi
          if [[ "$PROMO_APPEARANCE" == both ]]; then appearances=(dark light); else appearances=("$PROMO_APPEARANCE"); fi
          echo "Tests: ${tests[*]}; appearances: ${appearances[*]}"
          first="${appearances[0]}"
          for appearance in "${appearances[@]}"; do
            xcrun simctl ui "$SIMULATOR_UDID" appearance "$appearance"
            for test in "${tests[@]}"; do
              name="${test#test}"
              bundle="$root/bundles/$appearance-$name.xcresult"
              log="$root/logs/$appearance-$name.log"
              video="$root/video/$name.mp4"
              recording=""
              if [[ "$appearance" == "$first" ]]; then
                xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 --force "$video" >"$root/logs/$name-record.log" 2>&1 &
                recording=$!
                sleep 3
                echo "$(date +%s)" >"$root/logs/$name.recording-start"
              fi
              echo "::group::$appearance $test"
              xcodebuild test-without-building \
                -project RailwayGameApp/RailwayGame.xcodeproj \
                -scheme RailwayGame \
                -configuration Debug \
                -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
                -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                -resultBundlePath "$bundle" \
                -only-testing:RailwayGameUITests/PromoMaterialTests/$test \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 1500 \
                -maximum-test-execution-time-allowance 1800 \
                CODE_SIGN_IDENTITY=- 2>&1 | tee "$log" | tail -n 40 || echo "::warning::$appearance $test did not pass"
              echo "::endgroup::"
              if [[ -n "$recording" ]]; then
                kill -INT "$recording" 2>/dev/null || true
                wait "$recording" 2>/dev/null || true
              fi
              # Free the disk between tests: the pictures are exported below
              # from the bundles, which stay.
            done
          done

      # Each kept attachment as <appearance>/<test>/<name>.png. The display's
      # screenshot is upright: a device on its side comes out turned a
      # quarter, turned back here (sips turns clockwise).
      - name: Export the promo material
        if: always() && inputs.kind == 'promo' && steps.promo.outcome != 'skipped'
        run: |
          root="$RUNNER_TEMP/promo"
          out="$RUNNER_TEMP/promo-material"
          mkdir -p "$out"
          for bundle in "$root"/bundles/*.xcresult; do
            [[ -e "$bundle" ]] || continue
            key=$(basename "$bundle" .xcresult)
            raw="$RUNNER_TEMP/attachments-$key"
            mkdir -p "$raw"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$raw" || continue
            BUNDLE_KEY="$key" RAW="$raw" OUT="$out" python3 - <<'PY' || echo "::warning::Could not name the pictures of $key"
          import json, os, re, shutil
          from pathlib import Path
          raw = Path(os.environ["RAW"])
          appearance, _, test = os.environ["BUNDLE_KEY"].partition("-")
          dest = Path(os.environ["OUT"], appearance, test)
          dest.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((raw / "manifest.json").read_text())
          pattern = re.compile(r"^([a-z0-9-]+)_\d+_")
          for item in manifest:
              for attachment in item.get("attachments", []):
                  exported = attachment["exportedFileName"]
                  match = pattern.match(attachment.get("suggestedHumanReadableName", ""))
                  if match and exported.endswith(".png"):
                      shutil.copy(raw / exported, dest / f"{match.group(1)}.png")
          PY
            rm -rf "$raw"
          done
          for shot in "$out"/*/*/*.png; do
            [[ -e "$shot" ]] || continue
            width=$(sips -g pixelWidth "$shot" | awk '/pixelWidth/ { print $2 }')
            height=$(sips -g pixelHeight "$shot" | awk '/pixelHeight/ { print $2 }')
            if (( width < height )); then sips -r 270 "$shot" >/dev/null; fi
          done
          mkdir -p "$out/video"
          cp "$root"/video/*.mp4 "$out/video/" 2>/dev/null || true
          # Where each recording's action starts: the test prints
          # "[promo] action-start <epoch>"; the recording began a moment
          # after the epoch kept in <test>.recording-start.
          {
            echo "simulator: ${SIMULATOR_NAME:-?} ($SIMULATOR_UDID)"
            echo "commit: $GITHUB_SHA"
            echo "inputs: device=${{ inputs.device }} appearance=${{ inputs.appearance }}"
            for start in "$root"/logs/*.recording-start; do
              [[ -e "$start" ]] || continue
              name=$(basename "$start" .recording-start)
              began=$(cat "$start")
              mark=$(grep -ho '\[promo\] action-start [0-9.]*' "$root"/logs/*-"$name".log 2>/dev/null | head -1 | awk '{print $3}')
              if [[ -n "$mark" ]]; then
                offset=$(python3 -c "print(max(0, round(float('$mark') - $began, 1)))")
                echo "video/$name.mp4: camera work starts about ${offset}s in"
              else
                echo "video/$name.mp4: no action marker in the log"
              fi
            done
          } >"$out/MANIFEST.txt"
          for video in "$out"/video/*.mp4; do
            [[ -e "$video" ]] || continue
            mdls -name kMDItemDurationSeconds -name kMDItemPixelWidth -name kMDItemPixelHeight "$video" | tr '\n' ' ' >>"$out/MANIFEST.txt" || true
            echo >>"$out/MANIFEST.txt"
          done
          cat "$out/MANIFEST.txt"
          find "$out" -type f | sort | sed "s|$out/||"
          du -sh "$out"

      - name: Upload the promo material
        if: always() && inputs.kind == 'promo' && steps.promo.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: promo-material
          path: ${{ runner.temp }}/promo-material
          if-no-files-found: warn
          retention-days: 7
          # PNGs and H.264 do not compress further.
          compression-level: 0

      - name: Upload the promo result bundles
        if: failure() && inputs.kind == 'promo'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: promo-xcresult
          path: ${{ runner.temp }}/promo/bundles
          if-no-files-found: warn
          retention-days: 3
