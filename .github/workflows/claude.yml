name: Claude Code

# Mentioning @claude in an issue, a pull request comment, a review or a new
# issue runs Claude Code (anthropics/claude-code-action) on a Linux runner:
# it answers in a comment and can push commits to a branch. It is billed to
# the Claude API key in the repository secret ANTHROPIC_API_KEY, not to a
# claude.ai plan. Only the owner, members and collaborators start it (the
# action itself also refuses users without write access and bots), so a
# stranger's comment in this public repository costs neither tokens nor a
# runner. GitHub runs issue and comment events from the default branch's
# copy of this file, and the action refuses a pull request whose copy differs
# from it, so a change to this file is tested only after the merge.
# Adapted from anthropics/claude-code-action's examples/claude.yml (MIT
# License, Copyright (c) 2025 Anthropic, PBC).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  # TEMPORARY (never merged): checks the API key from this pull request.
  pull_request:

jobs:
  key-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the API key with one tiny request
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          raw = os.environ.get("KEY", "")
          print("length:", len(raw))
          print("starts with sk-ant-api03-:", raw.strip().startswith("sk-ant-api03-"))
          print("leading/trailing whitespace:", raw != raw.strip())
          print("whitespace inside:", any(c.isspace() for c in raw.strip()))
          def ask(key, model):
              body = json.dumps({"model": model, "max_tokens": 8,
                                 "messages": [{"role": "user", "content": "ping"}]}).encode()
              req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=body, headers={
                  "x-api-key": key, "anthropic-version": "2023-06-01", "content-type": "application/json"})
              try:
                  r = json.load(urllib.request.urlopen(req, timeout=60))
                  print(model, "-> OK", r.get("model"), r.get("usage"))
              except urllib.error.HTTPError as e:
                  print(model, "-> HTTP", e.code, e.read().decode()[:500])
          ask(raw, "claude-opus-5-5")
          if raw != raw.strip():
              ask(raw.strip(), "claude-opus-5-5")
          EOF
      - name: Check Claude Code itself with the key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.296 >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          for model in claude-opus-5-5 default; do
            args=(-p "Reply with the single word: pong" --output-format json --max-turns 1)
            [ "$model" = default ] || args+=(--model "$model")
            claude "${args[@]}" > out.json 2> err.txt || true
            python3 - "$model" <<'EOF'
          import json, sys
          try:
              d = json.load(open("out.json"))
              print(sys.argv[1], "->", {k: d.get(k) for k in ("is_error", "result", "total_cost_usd", "duration_ms")})
          except Exception as e:
              print(sys.argv[1], "-> no JSON:", e, open("out.json").read()[:500], open("err.txt").read()[:500])
          EOF
          done

  action-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run the action itself, with its full output shown
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: "Reply with the single word: pong. Do not use any tools."
          claude_args: |
            --model claude-opus-5-5
            --max-turns 2

  claude:
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time per issue or pull request, so two mentions do not
    # push to the same branch at once: a later mention waits instead of
    # cancelling (GitHub keeps one waiting run per group, so a third mention
    # replaces the waiting one). On the job, not the workflow, so the runs of
    # comments without a mention (Claude's own among them) skip the job and
    # never take the group.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The owner's choice; Claude Code's own default model may change.
          claude_args: |
            --model claude-opus-5-5
