name: Claude Code

# Mentioning @claude in an issue, a pull request comment, a review or a new
# issue runs Claude Code (anthropics/claude-code-action) on a Linux runner:
# it answers in a comment and can push commits to a branch. It is billed to
# the Claude API key in the repository secret ANTHROPIC_API_KEY, not to a
# claude.ai plan. Only the owner, members and collaborators start it (the
# action itself also refuses users without write access and bots), so a
# stranger's comment in this public repository costs neither tokens nor a
# runner. GitHub runs issue and comment events from the default branch's
# copy of this file, and the action refuses a pull request whose copy differs
# from it, so a change to this file is tested only after the merge.
# Adapted from anthropics/claude-code-action's examples/claude.yml (MIT
# License, Copyright (c) 2025 Anthropic, PBC).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time per issue or pull request, so two mentions do not
    # push to the same branch at once: a later mention waits instead of
    # cancelling (GitHub keeps one waiting run per group, so a third mention
    # replaces the waiting one). On the job, not the workflow, so the runs of
    # comments without a mention (Claude's own among them) skip the job and
    # never take the group.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The owner's choice; Claude Code's own default model may change.
          claude_args: |
            --model claude-opus-5-5
