name: iOS App Build

# Build and UI tests against the real Apple SDK, and a check that the
# committed Xcode project still matches project.yml.
# GameCore tests stay in ci.yml (Linux); the unsigned Release device archive
# lives in release-archive.yml. The iPhone job also checks the Traditional
# Chinese translations (an Xcode string export), which had a macOS job of its
# own until 2026-10-09: that job ran about a minute and waited for a runner up
# to 23 minutes.
#
# Two lanes, chosen by the event:
#
# - Pull requests (the gate): the build, the project check and a short list of
#   UI tests on an iPhone Simulator, the ones only a Simulator can answer: the
#   start screen, the three tools, starting, saving and continuing a game
#   (a blank new game and a real-world map, in English; the demo map and the
#   other languages run in the full lane), Back to Start with large text,
#   and the tutorial's first steps. The iPad job runs only
#   when the change touches the tutorial's own files. Kept short and steady so
#   a red result means something: about 6 minutes of tests (decision 199).
# - The full lane: main after a merge, at most every three hours
#   (ios-full-lane.yml starts it unless main's newest commit has had one), a
#   nightly run and manual runs. All
#   the UI tests (map gestures, large text, landscape too), the iPad tutorial
#   tests and, nightly and on request, the proof below that a missing toolbar
#   button fails the smoke test. A red result here does not block a pull
#   request; it is fixed by the next one.
#
# The UI tests are the check. They take no screenshots and nothing compares
# images: what the screen looks like is checked on devices through TestFlight.
# A failed run uploads its result bundle, which holds XCTest's own screenshot
# of each failure.
#
# The full lane runs the build job, two more iPhone jobs, and the iPad job
# in parallel. Each boots its Simulator once. Its four jobs hold at most
# four of the five macOS runners.
#
# A pull request whose change to the app has already passed here is not
# tested again (decision 187): the changes job keys the change (see "Key of
# the pull request's change to the app" below), and a run whose macOS jobs
# all passed records the key in the pull request's cache. On 2026-10-12, 35
# of 100 pull request runs (524 macOS minutes) tested again a change that
# had passed: main merged into the branch, a docs fix, a re-run.
#
# By hand, the input only_testing runs just the named UI tests (fixing one
# test should not take the whole full lane's 48 minutes of macOS); its run
# is named "UI tests by hand: ...", and ios-full-lane.yml does not count it
# as a full run.

run-name: "${{ inputs.only_testing && format('UI tests by hand: {0}', inputs.only_testing) || (github.event_name == 'pull_request' && github.event.pull_request.title || github.workflow) }}"

on:
  # Changes the app cannot see do not run it: the docs, the package's tests
  # and fixtures, the web probe, the tools, the session tooling (.claude/)
  # and the other workflows' own files. The app builds only RailwayGameApp/
  # and the package's Sources/. The full lane runs everything whatever
  # changed. Markdown is ignored at the top level only: the app bundles
  # licence files written in Markdown (Resources/Licenses/), and the
  # project lists each of them. The changes job's key leaves out the same
  # paths; keep the lists the same.
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "Tests/**"
      - "GoldenScenarios/**"
      - "SaveFixtures/**"
      - "ReplayFixtures/**"
      - "Web/**"
      - "tools/**"
      - ".claude/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/wasm-probe.yml"
      - ".github/workflows/ios-full-lane.yml"
      - ".github/workflows/release-archive.yml"
      - ".github/workflows/testflight*.yml"
      - ".github/workflows/website-screenshots.yml"
      - ".github/workflows/claude.yml"
      - ".github/scripts/swift-shards*.sh"
      - ".github/scripts/testflight-*"
      - ".github/scripts/install-swift-linux.sh"
      - ".github/testflight-whats-new.md"
  # Pushes to main no longer run it (until 2026-10-11 each did): merges come
  # in bursts and a newer one cancelled the run in progress, so from
  # 2026-10-09 to 2026-10-11 52 of the 79 runs on main were cancelled and
  # only 27 finished, yet they took a third of all macOS runner time (1,826
  # of 5,474 minutes). A merge now starts ios-full-lane.yml instead, which
  # starts a full run of main at most every three hours and only when main's
  # newest commit has had none.
  # 18:17 UTC is 02:17 in Taipei. A scheduled run uses the default branch.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      verify_missing_button:
        description: Temporarily remove Select (the tool rail's Done) and prove the English smoke test fails
        type: boolean
        default: false
      only_testing:
        description: "Only these UI tests, separated by spaces or commas (Class or Class/testMethod, e.g. SettingsUITests/testTheCityPreviewLoadsItsPageAndCloses); no iPad job unless only_testing_ipad. Empty: the full lane"
        type: string
        default: ""
      only_testing_ipad:
        description: "With only_testing: run the same UI tests on an iPad too (the iPad job), e.g. TutorialJourneyUITests"
        type: boolean
        default: false

permissions:
  contents: read

# The last three manual full lanes on main (39053855189, 39070554849,
# 39084020106) put LessonUITests at 1,556–2,030 s and the build job at
# 62–79 minutes. The second job took 32–38 minutes. Give LessonUITests its
# own job; the build job keeps every other class not named here. The pull
# request gate list below is unchanged.
env:
  FULL_LANE_SECOND_JOB: "MapInteractionTests RealWorldMapUITests SettingsUITests"
  FULL_LANE_LESSONS_JOB: "LessonUITests"

# A newer push to a pull request cancels its older run. Every other run (the
# full lane: started after a merge, nightly or by hand) has its own group
# and is never cancelled, so a manual run and the nightly one on the same
# commit do not replace each other.
concurrency:
  group: ios-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes (does the iPad job need to run? has this change passed?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ipad: ${{ steps.detect.outputs.ipad }}
      key: ${{ steps.key.outputs.key }}
      passed: ${{ steps.passed.outputs.cache-hit }}
    steps:
      # Depth 2 is enough: on a pull request the checkout is the pull request
      # merged into its base, whose two parents are both fetched.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Everything but a pull request runs the iPad job. A pull request runs
      # it when it touches the tutorial's own files (its card, targets,
      # steps and tests) or this pipeline: the card's placement differs most
      # between an iPhone and an iPad. The screens the tutorial points at
      # (the map, the tool rail, the panels) are left to the full lane, which
      # runs the iPad tests on main at most three hours apart: from
      # 2026-10-10 a change to any of them ran the iPad job too, 114 of the
      # 203 pull requests of the week to 2026-10-11 (26 touched the
      # tutorial's own files), while on the iPhone the gate still runs the
      # tutorial's first steps on every pull request. If the changed files
      # cannot be listed, run it.
      - name: Detect changes to the tutorial's own files
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          ONLY_TESTING: ${{ inputs.only_testing }}
          ONLY_TESTING_IPAD: ${{ inputs.only_testing_ipad }}
        run: |
          ipad=true
          if [[ -n "$ONLY_TESTING" ]]; then
            # The named UI tests run on the iPhone alone, unless asked for
            # on an iPad too.
            [[ "$ONLY_TESTING_IPAD" == true ]] || ipad=false
          elif [[ "$EVENT" == pull_request ]]; then
            if files="$(git diff --name-only HEAD^1 HEAD)"; then
              echo "Changed files:"
              echo "$files"
              if grep -Eq '^(RailwayGameApp/Views/Tutorial|RailwayGameApp/UITests/TutorialUITests|Sources/GamePresentation/Tutorial|\.github/workflows/ios-build\.yml)' <<<"$files"; then
                ipad=true
              else
                ipad=false
              fi
            else
              echo "::warning::Could not list the changed files; running the iPad job."
            fi
          fi
          echo "ipad=$ipad" >> "$GITHUB_OUTPUT"
          echo "iPad job: $ipad"

      # The key of what this pull request changes in the app: the patch ID
      # of its diff against the base (HEAD^1 is the base, HEAD the pull
      # request merged into it), over every path this workflow does not
      # ignore. git patch-id leaves out line numbers and the blobs' hashes,
      # so main moving on elsewhere keeps the key, while a change near the
      # pull request's own lines (in the diff's context), a conflict
      # resolved in an app file, or any new commit to the app changes it.
      # --binary keeps images and other binary files in it; --verbatim keeps
      # whitespace (YAML and Python depend on it). The iPad decision is in
      # the key too. Only a pull request from this repository has a key: a
      # fork's always runs everything. Its cache is the pull request's own
      # (refs/pull/N/merge), which no other pull request can read or write.
      # Nothing to key (an empty diff, a git error) runs everything. To force
      # a run, delete the cache entry (Actions, Caches) or bump v1.
      - name: Key of the pull request's change to the app
        id: key
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          IPAD: ${{ steps.detect.outputs.ipad }}
        run: |
          set -o pipefail
          # The paths of pull_request.paths-ignore above.
          id="$(git diff --binary --no-renames HEAD^1 HEAD -- . \
            ':(exclude,glob)*.md' ':(exclude,glob)docs/**' ':(exclude,glob)Tests/**' \
            ':(exclude,glob)GoldenScenarios/**' ':(exclude,glob)SaveFixtures/**' ':(exclude,glob)ReplayFixtures/**' \
            ':(exclude,glob)Web/**' ':(exclude,glob)tools/**' ':(exclude,glob).claude/**' \
            ':(exclude,glob).github/workflows/ci.yml' ':(exclude,glob).github/workflows/wasm-probe.yml' \
            ':(exclude,glob).github/workflows/ios-full-lane.yml' ':(exclude,glob).github/workflows/release-archive.yml' \
            ':(exclude,glob).github/workflows/testflight*.yml' ':(exclude,glob).github/workflows/website-screenshots.yml' \
            ':(exclude,glob).github/workflows/claude.yml' \
            ':(exclude,glob).github/scripts/swift-shards*.sh' ':(exclude,glob).github/scripts/testflight-*' \
            ':(exclude,glob).github/scripts/install-swift-linux.sh' ':(exclude,glob).github/testflight-whats-new.md' \
            | git patch-id --verbatim | cut -d' ' -f1)"
          if [[ ! "$id" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Nothing in the app to key; the macOS jobs run."
            exit 0
          fi
          echo "key=ios-pr-passed-v1-ipad-$IPAD-$id" >> "$GITHUB_OUTPUT"
          echo "Key of this change to the app: ios-pr-passed-v1-ipad-$IPAD-$id"

      # Exact key only. A failure to read the cache runs everything.
      - name: Has this change passed before?
        id: passed
        if: steps.key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ios-pr-passed
          key: ${{ steps.key.outputs.key }}

      - name: Report a change that passed before
        if: steps.passed.outputs.cache-hit == 'true'
        run: |
          run="$(cat .ios-pr-passed/run 2>/dev/null || echo "an earlier run")"
          echo "This pull request's change to the app passed in $run; the macOS jobs are skipped (decision 187)." | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Xcode build (iOS Simulator)
    # Skipped only when this change passed before; if the changes job
    # failed, it runs.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.passed != 'true' }}
    runs-on: macos-26
    # 20m37s on the #72 head; the same job takes up to about 1.8 times as long
    # on a slower runner, so the limit only catches a hang. Room too for a
    # first boot's data migration (up to 14 minutes), the warm-up launch and
    # the translation check (about a minute). 80 for the full lane (a
    # schedule or a run by hand) since its UI step got 60 (below): on
    # 2026-10-13 the job reached 60 minutes with the step cut at 40, booting
    # the Simulator now takes 4 to 6 minutes, and the string export up to 5.
    # A pull request's UI step stops at 25, so its job keeps 60. 95 for the
    # full lane since its UI step got 75 (below): on 2026-10-15 the job took
    # some 72 of its 80 minutes (main 2ec70b2, run 38720199489).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 95 }}
    steps:
      # Depth 2: a pull request's checkout is the pull request merged into its
      # base, and the archivable-products check below compares the two.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The translation check compares the export with the committed catalog,
      # not with what an Xcode build or export may add to the working copy.
      - name: Keep the committed string catalog
        run: git show HEAD:RailwayGameApp/Resources/Localizable.xcstrings >"$RUNNER_TEMP/Localizable.xcstrings"

      - name: Toolchain versions
        run: |
          sw_vers
          uname -m
          xcode-select --print-path
          xcodebuild -version
          swift --version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Set up XcodeGen
        uses: ./.github/actions/setup-xcodegen

      # The project is committed because Xcode Cloud needs it (and its shared
      # scheme) in the repository. Regenerating it in place must change
      # nothing; otherwise it is stale or was edited outside project.yml.
      - name: Check the committed Xcode project matches project.yml
        id: project-check
        run: |
          project=RailwayGameApp/RailwayGame.xcodeproj
          scheme="$project/xcshareddata/xcschemes/RailwayGame.xcscheme"
          if ! git ls-files --error-unmatch "$scheme" >/dev/null 2>&1; then
            echo "::error::The shared scheme $scheme is not committed; Xcode Cloud needs it."
            exit 1
          fi
          xcodegen generate --spec RailwayGameApp/project.yml
          changes="$(git status --porcelain --untracked-files=all -- RailwayGameApp)"
          if [[ -n "$changes" ]]; then
            echo "::error::$project does not match RailwayGameApp/project.yml. Regenerate it with the pinned XcodeGen from a checkout directory named railway-game-ios and commit the result (see README, Building). This run's regenerated-xcodeproj artifact holds the expected project."
            echo "$changes"
            git --no-pager diff -- RailwayGameApp
            exit 1
          fi
          echo "Committed project matches a fresh generation."

      - name: Upload regenerated project
        if: failure() && steps.project-check.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          # A re-run of a failed job uploads the same names again.
          overwrite: true
          name: regenerated-xcodeproj
          path: RailwayGameApp/RailwayGame.xcodeproj
          retention-days: 7

      # Xcode Cloud onboarding lists the products this command finds (Apple:
      # "Configuring your first Xcode Cloud workflow"); the app must be one.
      # The local package's GameCore and GamePresentation libraries are
      # listed too. What it lists comes from the project alone, so a pull
      # request that changes neither the project nor how it is generated
      # skips the check (about 25 seconds); the full lane always runs it. If
      # the changed files cannot be listed, it runs.
      - name: List schemes and archivable products
        env:
          EVENT: ${{ github.event_name }}
        run: |
          project=RailwayGameApp/RailwayGame.xcodeproj
          if [[ "$EVENT" == pull_request ]] && git diff --quiet HEAD^1 HEAD -- \
            RailwayGameApp/project.yml "$project" .github/actions/setup-xcodegen .github/workflows/ios-build.yml; then
            echo "The pull request changes neither the project nor its generation; the products are the ones the base branch already checked."
            exit 0
          fi
          xcodebuild -list -project "$project"
          products="$(xcodebuild -project "$project" -describeAllArchivableProducts -json)"
          echo "$products"
          if ! grep -Eq '"bundleIdentifier" *: *"io\.github\.a91453\.RailwayGame"' <<<"$products"; then
            echo "::error::Xcode finds no archivable io.github.a91453.RailwayGame app, so Xcode Cloud could not offer it."
            exit 1
          fi

      - name: Select an available iPhone Simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ["RUNNER_TEMP"], "simulators.json").read_text())["devices"]
          iphones = [device for runtime, group in devices.items()
                     if ".iOS-" in runtime for device in group
                     if device["isAvailable"] and device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone Simulator")
          device = iphones[0]
          print(f"Selected {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_UDID={device['udid']}\n")
          PY

      # Built for the selected Simulator, the destination the UI tests use, so
      # only for its architecture (Debug builds only the active one). Building
      # needs no booted Simulator. The generic Simulator destination used until
      # 2026-10-11 has no active architecture and compiled every file for
      # x86_64 too (225 files twice in run 38107355047, about 35 seconds),
      # which no test on the Apple-silicon runner runs, and the UI tests then
      # relinked the app for arm64 alone. Package resolution is disabled as on
      # Xcode Cloud, which only uses a committed Package.resolved, so a
      # missing one fails here first.
      # Built for testing too, signed ad hoc (`-`, no certificate or Apple
      # Developer account) as the UI tests need, so the UI test step runs
      # these products without building (decision 199). Until 2026-10-13 this
      # step built the app unsigned, and the UI test step then built the test
      # target and relinked and signed the app (12 to 25 s of that step).
      - name: Build for iOS Simulator
        id: app-build
        run: |
          xcodebuild build-for-testing \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=-

      # release-archive.yml proves no Debug-only launch argument code is in
      # the Release binary by not finding this marker there. Prove it finds
      # the marker where the code is, or that check would pass vacuously.
      - name: Check the Debug app carries the Debug-only marker
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/RailwayGame.app"
          marker="RailwayGame Debug-only launch argument"
          if ! grep -rqF -- "$marker" "$app"; then
            echo "::error::The Debug app does not contain \"$marker\" (see DebugLaunch in RailwayGameApp.swift); the Release archive check that looks for it would prove nothing."
            exit 1
          fi
          echo "The Debug app carries the Debug-only marker."

      # Decision 257: the app carries both languages (release-archive.yml
      # checks the Release archive the same way).
      - name: Check the app has English and Traditional Chinese
        run: .github/scripts/check-app-localizations.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/RailwayGame.app"

      # Booted only after the build: booting while the app built (#211) slowed
      # the build from 1.4 to 4.8 minutes on the runner's 3 cores and saved
      # only 0.6 of the boot's 3, so the job took longer.
      # Boot explicitly before XCTest installs its runner. A cold Simulator
      # otherwise leaves xcodebuild waiting without any test progress logs.
      # A never-booted device's first boot migrates its data first: run
      # 37121712618 spent 7m38s in "Waiting on Data Migration" (locationd)
      # and was stopped at 8 minutes; others took up to 6m28s.
      - name: Boot the selected iPhone Simulator
        timeout-minutes: 14
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # The first launch on a freshly booted device is the slow one: in run
      # 37112399702 xcodebuild did not start launching the app for 80 s and
      # the first UI test timed out, while the next launched in under a
      # second. Launch the built app once here, outside any test.
      # It only helps the tests, so a warm-up that fails or runs out of time
      # is a warning, not a red job: in #355's run 38111760884, on a slow
      # runner, the step hit its 5-minute limit and the job ended there
      # without running a single UI test (it took 87 s, 182 s at the 90th
      # percentile, from 2026-10-09 to 2026-10-11).
      - name: Warm up the app's first launch
        timeout-minutes: 5
        continue-on-error: true
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/RailwayGame.app"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          if xcrun simctl launch "$SIMULATOR_UDID" io.github.a91453.RailwayGame -ui-testing; then
            sleep 10
            xcrun simctl terminate "$SIMULATOR_UDID" io.github.a91453.RailwayGame || true
          else
            echo "::warning::The warm-up launch failed; the UI tests launch the app themselves."
          fi

      # A pull request runs the gate list; everything else runs all the UI
      # tests. The gate keeps what only a Simulator can answer and leaves the
      # gesture, large-text and landscape tests, the slowest and the least
      # steady, to the full run, and the Traditional Chinese toolbar and
      # start/save flow and the Japanese fallback too: the English ones take
      # the same paths, and the translation check below checks the
      # translations.
      # Decision 199: the gate's tests take about 6 minutes at most. A test
      # joins it only if it is steady, only a Simulator can answer it, and
      # it fits; otherwise it runs in the full lane, which runs after each
      # merge and must be green before a TestFlight release.
      # Each test may run 8 minutes at most (the slowest, the line route
      # test, took 188 s; a slow runner up to 1.8 times as long). A launch
      # that hangs then fails its one test instead of the whole step: on
      # #207's run Xcode could not resume the launched app (DTServiceHub
      # "Failed to send signal 19 ... 3"), the next launch hung 22 minutes
      # until the step's limit, and no result bundle was left to read.
      - name: UI smoke tests (English and Traditional Chinese)
        id: ui-smoke
        # The full list took 16m39s to 24m49s (median 20m11s) over the 21
        # full runs on main from 2026-10-09 to 10-11 (28 tests by then),
        # counting cold XCTest startup and Xcode writing the result bundle;
        # the 25 minutes set when it took 12m29s left the slowest 11 s. A
        # slower runner can take 1.8 times as long: 36 minutes. The gate list
        # took at most 12.7 minutes on 2026-10-12 (8 tests; a ninth, the
        # tutorial's line step, adds about a minute), so a pull request has
        # 25: a hung app then holds a macOS runner 15 minutes less. With 10
        # tests it took 9m59s to 15m02s (median 12m23s) over 13 pull request
        # runs on 2026-10-13; decision 199 then took 3 of them out and the
        # idle second from each wait. The full list then outgrew its 40: it
        # took 19m55s to 23m19s on main on 2026-10-12, but 30m14s and 33m21s,
        # and four runs cut at 40 minutes (40m13s to 40m21s) on 2026-10-13,
        # one of them with the tutorial classes still to run (run
        # 38458089903: its first test alone took 7.5 minutes on a slow
        # Simulator). 60 lets the slowest of those finish. With 63 tests it
        # took 38m51s to some 55 minutes on main on 2026-10-14 and 10-15
        # (9a88ef0, 237f194 44m51s, 6e86506, 2ec70b2: 53 minutes of tests
        # alone, run 38720199489), 5 minutes short of the 60: 75 leaves a
        # slow runner room and still stops a hang.
        timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 75 }}
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          only=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            lane="gate (pull request): the short list"
            only=(
              -only-testing:RailwayGameUITests/ToolbarSmokeTests/testEnglishToolbar
              # A blank new game (sights and the city's requests on) and a
              # real-world one: their game menus are the longest, and the
              # demo map's flow never showed that Back to Start fell out of
              # reach on a phone on its side. The house's saving and
              # continuing also proves what was built is kept, which the
              # demo map's flow did not (decision 199 left that flow, the
              # layers sheet and the follow camera to the full lane).
              -only-testing:RailwayGameUITests/StartSaveFlowSmokeTests/testAHouseBuiltOnABlankMapIsKeptBySavingAndContinuing
              -only-testing:RailwayGameUITests/RealWorldMapUITests/testARealWorldGameStartsFromAPlaceAndIsSavedAsOne
              # TestFlight 54.1: Back to Start with the clock running and
              # the largest text short of the accessibility sizes (an open
              # menu was rebuilt every tick and its last row was out of
              # reach).
              -only-testing:RailwayGameUITests/StartSaveFlowSmokeTests/testBackToStartWorksWithLargeTextWhileTheClockRuns
              -only-testing:RailwayGameUITests/TutorialUITests/testEnglishTutorialNavigation
              -only-testing:RailwayGameUITests/TutorialUITests/testBuildingTrackEnablesNextAndSkipEnds
              # The line step's lines panel on a phone (2026-10-12: the card
              # covered Pick on Map on a device and the step could not be done).
              -only-testing:RailwayGameUITests/TutorialUITests/testTheLineStepLeavesTheLinesPanelUsable
            )
          else
            lane="full ($GITHUB_EVENT_NAME): all the UI tests but the other iPhone jobs' ($FULL_LANE_SECOND_JOB $FULL_LANE_LESSONS_JOB)"
            # Decision 165: the website's screenshots are taken by
            # website-screenshots.yml alone; they test nothing.
            only=(-skip-testing:RailwayGameUITests/WebsiteScreenshotTests)
            # These classes run in the other iPhone jobs.
            for class in $FULL_LANE_SECOND_JOB $FULL_LANE_LESSONS_JOB; do
              only+=("-skip-testing:RailwayGameUITests/$class")
            done
          fi
          # By hand, only the named tests (Class or Class/testMethod; the
          # target is added).
          if [[ -n "$ONLY_TESTING" ]]; then
            only=()
            IFS=', ' read -r -a tests <<<"$ONLY_TESTING"
            for test in "${tests[@]}"; do
              [[ -n "$test" ]] || continue
              if [[ ! "$test" =~ ^[A-Za-z0-9_]+(/[A-Za-z0-9_]+){0,2}$ ]]; then
                echo "::error::Not a UI test name: $test"
                exit 1
              fi
              [[ "$test" == RailwayGameUITests/* ]] || test="RailwayGameUITests/$test"
              only+=("-only-testing:$test")
            done
            if (( ${#only[@]} == 0 )); then
              echo "::error::only_testing names no test."
              exit 1
            fi
            lane="by hand: ${only[*]}"
          fi
          echo "UI test lane: $lane"
          echo "- **UI test lane:** $lane" >> "$GITHUB_STEP_SUMMARY"
          # What the build step built for testing; nothing is built here.
          xcodebuild test-without-building \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ui-smoke.xcresult" \
            ${only[@]+"${only[@]}"} \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 600 \
            -disableAutomaticPackageResolution

      - name: Upload failed UI test results
        if: always() && (steps.ui-smoke.outcome == 'failure' || steps.ui-smoke.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          # A re-run of a failed job uploads the same names again.
          overwrite: true
          name: ui-smoke-xcresult
          path: ${{ runner.temp }}/ui-smoke.xcresult
          if-no-files-found: warn
          retention-days: 7

      # K4 (#366): a tap the test saw pressed whose action never ran. The
      # app writes each touch it got (where, on which view of which window)
      # and the named buttons' actions to the unified log under -ui-testing
      # (`UITestTrace` in RailwayGameApp.swift); kept beside the result
      # bundle, so the next such failure says whether the touch arrived and
      # whether the action ran. A run by hand of named tests keeps it too,
      # passed or not: it holds the frame meter's readings (#791's review).
      - name: Save the app's UI test trace
        if: always() && (steps.ui-smoke.outcome == 'failure' || steps.ui-smoke.outcome == 'cancelled' || inputs.only_testing != '')
        continue-on-error: true
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 3h --style compact \
            --predicate 'subsystem == "io.github.a91453.RailwayGame" AND category == "ui-test"' \
            > "$RUNNER_TEMP/ui-smoke-trace.log" || echo "::warning::Could not read the app's UI test trace"

      - name: Upload the app's UI test trace
        if: always() && (steps.ui-smoke.outcome == 'failure' || steps.ui-smoke.outcome == 'cancelled' || inputs.only_testing != '')
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: ui-smoke-trace
          path: ${{ runner.temp }}/ui-smoke-trace.log
          if-no-files-found: warn
          retention-days: 7

      # The Traditional Chinese translations, on a pull request and the full
      # lane; not on a run by hand of named UI tests (only_testing), which
      # is there to fix a test: the pull request and the full lane still
      # check them, and on 2026-10-16 the 94 runs by hand spent 283 macOS
      # minutes on the export, as much as on their UI tests, and one (run
      # 38929483452) went red when its export passed 15 minutes on a slow
      # runner (decision 265). It runs after the
      # UI tests, and also when they failed, so each reports on its own. The
      # export builds with SWIFT_EMIT_LOC_STRINGS into its own derived data,
      # leaving the tested build alone. It cannot reuse the tested build:
      # -exportLocalizations builds for the iOS device SDK (Debug-iphoneos)
      # whatever -destination says, so #356, which gave it this job's
      # Simulator, derived data and settings, still compiled all 226 files
      # (run 38111831569, 86 s against 97 s before).
      - name: Test the localization checker
        id: localization-selftest
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && !inputs.only_testing }}
        run: python3 .github/scripts/check-localization-selftest.py

      - name: Export Swift strings with Xcode
        id: localization-export
        if: ${{ !cancelled() && steps.localization-selftest.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          xcodebuild -exportLocalizations \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -localizationPath "$RUNNER_TEMP/loc" \
            -exportLanguage zh-Hant \
            -destination "generic/platform=iOS Simulator" \
            -disableAutomaticPackageResolution \
            SWIFT_EMIT_LOC_STRINGS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Check zh-Hant targets and committed catalog keys
        if: ${{ !cancelled() && steps.localization-export.outcome == 'success' }}
        run: |
          python3 .github/scripts/check-localization.py \
            --export "$RUNNER_TEMP/loc" \
            --catalog "$RUNNER_TEMP/Localizable.xcstrings"

      - name: Upload localization export for diagnostics
        if: ${{ !cancelled() && steps.localization-export.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          # A re-run of a failed job uploads the same names again.
          overwrite: true
          name: localization-export
          path: |
            ${{ runner.temp }}/loc
            ${{ runner.temp }}/Localizable.xcstrings
          if-no-files-found: ignore
          retention-days: 7

      # Proof that the smoke test can fail: nightly and on request, not on
      # every pull request. Restore the source afterwards; this broken build
      # never replaces the normal test run. It reuses the iPhone
      # Simulator the smoke tests already booted.
      - name: Prove a missing toolbar button fails the smoke test
        id: missing-button
        # It rebuilds the app without Select first: 2m03s to 4m11s measured.
        timeout-minutes: 10
        # After the translation check, but not held back by it.
        if: ${{ !cancelled() && steps.ui-smoke.outcome == 'success' && (github.event_name == 'schedule' || inputs.verify_missing_button) }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          bash .github/scripts/ui-smoke-missing-button.sh

      - name: Upload missing-button failure evidence
        if: always() && steps.missing-button.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          # A re-run of a failed job uploads the same names again.
          overwrite: true
          name: ui-smoke-missing-button-evidence
          path: |
            ${{ runner.temp }}/ui-smoke-missing-button.xcresult
            ${{ runner.temp }}/ui-smoke-missing-button-summary.json
            ${{ runner.temp }}/ui-smoke-missing-button.log
          if-no-files-found: error
          retention-days: 7

  # The full lane's other iPhone jobs: one for the map/real-world/settings
  # classes and one for lessons. The build job runs the remaining classes.
  # Neither runs for a pull request or only_testing by hand.
  ui-full-lane:
    name: Xcode UI tests, ${{ matrix.partition }} (iOS Simulator)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.only_testing }}
    strategy:
      fail-fast: false
      matrix:
        partition: [second, lessons]
    runs-on: macos-26
    env:
      PARTITION: ${{ matrix.partition }}
    # Build (about 8 minutes on a slow runner), boot (14 at most), warm-up
    # (5) and the tests (45).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Select an available iPhone Simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ["RUNNER_TEMP"], "simulators.json").read_text())["devices"]
          iphones = [device for runtime, group in devices.items()
                     if ".iOS-" in runtime for device in group
                     if device["isAvailable"] and device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone Simulator")
          device = iphones[0]
          print(f"Selected {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_UDID={device['udid']}\n")
          PY

      # As the build job's step of the same name: for the selected
      # Simulator, signed ad hoc, before the boot.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=-

      - name: Boot the selected iPhone Simulator
        timeout-minutes: 14
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # As the build job's: the first launch on a fresh device is the slow one.
      - name: Warm up the app's first launch
        timeout-minutes: 5
        continue-on-error: true
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/RailwayGame.app"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          if xcrun simctl launch "$SIMULATOR_UDID" io.github.a91453.RailwayGame -ui-testing; then
            sleep 10
            xcrun simctl terminate "$SIMULATOR_UDID" io.github.a91453.RailwayGame || true
          else
            echo "::warning::The warm-up launch failed; the UI tests launch the app themselves."
          fi

      - name: UI tests, ${{ matrix.partition }}
        id: ui-partition
        timeout-minutes: 50
        run: |
          case "$PARTITION" in
            second) classes="$FULL_LANE_SECOND_JOB" ;;
            lessons) classes="$FULL_LANE_LESSONS_JOB" ;;
            *) echo "::error::Unknown UI test partition: $PARTITION"; exit 1 ;;
          esac
          only=()
          for class in $classes; do
            only+=("-only-testing:RailwayGameUITests/$class")
          done
          echo "UI tests, $PARTITION: ${only[*]}"
          echo "- **UI tests, $PARTITION:** $classes" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild test-without-building \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ui-$PARTITION.xcresult" \
            "${only[@]}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 600 \
            -disableAutomaticPackageResolution

      - name: Upload failed UI test results
        if: always() && (steps.ui-partition.outcome == 'failure' || steps.ui-partition.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: ui-${{ matrix.partition }}-xcresult
          path: ${{ runner.temp }}/ui-${{ matrix.partition }}.xcresult
          if-no-files-found: warn
          retention-days: 7

      # The app's touches and actions, as for the build job's UI tests (K4).
      - name: Save the app's UI test trace
        if: always() && (steps.ui-partition.outcome == 'failure' || steps.ui-partition.outcome == 'cancelled')
        continue-on-error: true
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 3h --style compact \
            --predicate 'subsystem == "io.github.a91453.RailwayGame" AND category == "ui-test"' \
            > "$RUNNER_TEMP/ui-$PARTITION-trace.log" || echo "::warning::Could not read the app's UI test trace"

      - name: Upload the app's UI test trace
        if: always() && (steps.ui-partition.outcome == 'failure' || steps.ui-partition.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: ui-${{ matrix.partition }}-trace
          path: ${{ runner.temp }}/ui-${{ matrix.partition }}-trace.log
          if-no-files-found: warn
          retention-days: 7

  ipad-tutorial:
    name: iPad tutorial tests (iOS Simulator)
    # A skipped job passes a required check, so a pull request that leaves the
    # tutorial's own files alone is not held up by it.
    needs: changes
    if: needs.changes.outputs.ipad == 'true' && needs.changes.outputs.passed != 'true'
    runs-on: macos-26
    # Room for the step limits below (boot 14, tests 30) and the rest.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          sw_vers
          uname -m
          xcode-select --print-path
          xcodebuild -version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Select an available iPad Simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ipad-simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ["RUNNER_TEMP"], "ipad-simulators.json").read_text())["devices"]
          ipads = [device for runtime, group in devices.items()
                   if ".iOS-" in runtime for device in group
                   if device["isAvailable"] and device["name"].startswith("iPad")]
          if not ipads:
              raise SystemExit("No available iPad Simulator")
          device = ipads[0]
          print(f"Selected {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"IPAD_SIMULATOR_UDID={device['udid']}\n")
          PY

      - name: Boot the selected iPad Simulator
        # A first boot's data migration can take most of 8 minutes (see the
        # iPhone job).
        timeout-minutes: 14
        run: xcrun simctl bootstatus "$IPAD_SIMULATOR_UDID" -b

      - name: iPad tutorial tests (bilingual and large text)
        id: ipad-tutorial
        # This step also compiles the app and the UI tests. It took 7 to 12
        # minutes on different runners (11m40s once), so leave room; the
        # whole tutorial's walk (TutorialJourneyUITests, not on a pull
        # request) adds a few minutes.
        timeout-minutes: 30
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          only=(-only-testing:RailwayGameUITests/TutorialUITests)
          # The full lane also walks the whole tutorial on the iPad; a pull
          # request leaves it to the full lane, as the iPhone's walk.
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            only+=(-only-testing:RailwayGameUITests/TutorialJourneyUITests/testTheWholeTutorialOnAnIPad)
          fi
          # By hand (only_testing_ipad), the named tests, as on the iPhone.
          if [[ -n "$ONLY_TESTING" ]]; then
            only=()
            IFS=', ' read -r -a tests <<<"$ONLY_TESTING"
            for test in "${tests[@]}"; do
              [[ -n "$test" ]] || continue
              if [[ ! "$test" =~ ^[A-Za-z0-9_]+(/[A-Za-z0-9_]+){0,2}$ ]]; then
                echo "::error::Not a UI test name: $test"
                exit 1
              fi
              [[ "$test" == RailwayGameUITests/* ]] || test="RailwayGameUITests/$test"
              only+=("-only-testing:$test")
            done
            if (( ${#only[@]} == 0 )); then
              echo "::error::only_testing names no test."
              exit 1
            fi
          fi
          echo "iPad UI tests: ${only[*]}"
          xcodebuild test \
            -project RailwayGameApp/RailwayGame.xcodeproj \
            -scheme RailwayGame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ipad-tutorial.xcresult" \
            "${only[@]}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 600 \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=-

      - name: Upload failed iPad tutorial results
        if: always() && (steps.ipad-tutorial.outcome == 'failure' || steps.ipad-tutorial.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          # A re-run of a failed job uploads the same names again.
          overwrite: true
          name: ipad-tutorial-xcresult
          path: ${{ runner.temp }}/ipad-tutorial.xcresult
          if-no-files-found: error
          retention-days: 7

      # The app's touches and actions, as for the iPhone's UI tests (K4).
      - name: Save the app's iPad UI test trace
        if: always() && (steps.ipad-tutorial.outcome == 'failure' || steps.ipad-tutorial.outcome == 'cancelled')
        continue-on-error: true
        run: |
          xcrun simctl spawn "$IPAD_SIMULATOR_UDID" log show --last 3h --style compact \
            --predicate 'subsystem == "io.github.a91453.RailwayGame" AND category == "ui-test"' \
            > "$RUNNER_TEMP/ipad-tutorial-trace.log" || echo "::warning::Could not read the app's UI test trace"

      - name: Upload the app's iPad UI test trace
        if: always() && (steps.ipad-tutorial.outcome == 'failure' || steps.ipad-tutorial.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: ipad-tutorial-trace
          path: ${{ runner.temp }}/ipad-tutorial-trace.log
          if-no-files-found: warn
          retention-days: 7

  # Records that this pull request's change to the app passed: the build
  # passed, and the iPad job passed or was not needed (the key says which).
  # A Linux job of a few seconds, so no macOS runner waits for the upload.
  remember:
    name: Remember that this change passed
    needs: [changes, build, ipad-tutorial]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.key != '' && needs.changes.outputs.passed != 'true'
      && needs.build.result == 'success'
      && (needs.ipad-tutorial.result == 'success' || needs.ipad-tutorial.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write the mark
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p .ios-pr-passed
          echo "$RUN_URL (attempt $GITHUB_RUN_ATTEMPT, ${GITHUB_SHA})" > .ios-pr-passed/run

      - uses: actions/cache/save@v4
        with:
          path: .ios-pr-passed
          key: ${{ needs.changes.outputs.key }}
