name: iOS Full Lane (nightly)

# Starts ios-build.yml's full lane (every UI test and the iPad tutorial tests)
# on main once a night, unless main's newest commit has already had a full
# run or one is still going. A Linux job of a few seconds; the full lane
# itself holds at most three macOS runners (decision 582) for up to about
# two hours.
#
# Decision 582 (amending 265): from 2026-11-04 a merge no longer starts it.
# Until then a merge started it at most every three hours; with four macOS
# jobs of 65 to 110 minutes each it held four of the account's five macOS
# runners for one and a half to two and a half hours, pull requests' Xcode
# builds and website screenshots queued an hour and more on the one left,
# and four of the five full lanes before 2026-11-04 were red in a flaky UI
# test that blocked no merge. Besides this nightly run, the full lane runs
# only by hand: on main's HEAD before a release, and to bisect a red one
# (ios-build.yml's Run workflow on the commit to test).
#
# This nightly run replaces ios-build.yml's own schedule (it ran every night
# even when the commit had been tested) and asks for the missing-button
# proof that schedule ran. 18:17 UTC is 02:17 in Taipei, 40 minutes after
# ci.yml's nightly run. A scheduled run uses the default branch.
#
# A full run that was cancelled still counts: GitHub reports a job that
# reached its time limit as cancelled, and nothing else cancels a full run
# (each has its own concurrency group), so not counting it would start the
# same commit's full lane again and again. One cancelled by hand is run
# again by hand.

on:
  schedule:
    - cron: "17 18 * * *"
  # By hand: starts the full lane if main's newest commit has had none, even
  # while another is going. ios-build.yml's own Run workflow always starts
  # one (on any commit).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-full-lane
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  start:
    name: Start the full lane unless main's newest commit had one
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Starting ios-build.yml (workflow_dispatch) and reading its runs.
      actions: write
      contents: read
    steps:
      - name: Look for a full run of main's newest commit; start one if there is none
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "main is at $sha."
          # Every run of ios-build.yml that is not a pull request's is the
          # full lane (manual, nightly, started here, or a push before
          # 2026-10-11), except a run by hand of only some UI tests (its
          # name starts "UI tests by hand:", decision 187). Each counts, queued, running or finished however
          # (a timed-out one reads cancelled), except one that never
          # started (startup_failure).
          runs="$(gh api "repos/$REPO/actions/workflows/ios-build.yml/runs?head_sha=$sha&per_page=100" \
            --jq '.workflow_runs[]
              | select(.event != "pull_request")
              | select((.display_title // "") | startswith("UI tests by hand:") | not)
              | select(.conclusion != "startup_failure")
              | "\(.html_url) (\(.event), \(.conclusion // .status))"')"
          if [[ -n "$runs" ]]; then
            echo "Already has a full run, so none is started:"
            echo "$runs"
            echo "main's newest commit ($sha) already has a full run: $(head -n 1 <<<"$runs")" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The nightly run does not start a second full lane while one is
          # queued or running (two would hold six macOS runners, more than
          # the account has); a run by hand does not wait.
          if [[ "$EVENT" != workflow_dispatch ]]; then
            going="$(gh api "repos/$REPO/actions/workflows/ios-build.yml/runs?branch=main&per_page=30" \
              --jq '[.workflow_runs[]
                  | select(.event != "pull_request")
                  | select((.display_title // "") | startswith("UI tests by hand:") | not)
                  | select(.status != "completed")][0] // empty
                | .html_url')"
            if [[ -n "$going" ]]; then
              echo "A full run is still going ($going); none is started tonight." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh workflow run ios-build.yml --repo "$REPO" --ref main -f verify_missing_button=true
            echo "Started ios-build.yml's full lane on main ($sha), with the missing-button proof." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run ios-build.yml --repo "$REPO" --ref main
          echo "Started ios-build.yml's full lane on main ($sha)." | tee -a "$GITHUB_STEP_SUMMARY"
