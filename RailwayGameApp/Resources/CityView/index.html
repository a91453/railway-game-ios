<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedural Tokyo</title>
    <style>html,body{background:#0c1220;height:100%;margin:0;overflow:hidden}canvas{display:block}#hud{color:#e8ecf2;pointer-events:none;white-space:pre;background:#0a0e16a8;border-radius:6px;max-width:340px;padding:10px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;position:fixed;top:12px;left:12px}#credits{left:50%;bottom:max(6px, env(safe-area-inset-bottom));box-sizing:border-box;text-align:center;color:#3c3c43bf;pointer-events:none;background:#ffffffb3;border-radius:4px;width:max-content;max-width:calc(100% - 184px);padding:1px 5px;font:11px/1.4 -apple-system,system-ui,PingFang TC,sans-serif;position:fixed;transform:translate(-50%)}#credits:empty{display:none}#credits span{white-space:nowrap}#mode{cursor:pointer;background:#cfd6dc 50%/cover no-repeat;border:2px solid #fff;border-radius:12px;width:68px;height:68px;padding:0;transition:box-shadow .12s;position:fixed;bottom:12px;left:12px;box-shadow:0 2px 8px #00000073}#mode.live{background:0 0!important}#mode:hover{box-shadow:0 0 0 2px #ffffff8c,0 3px 12px #0009}#mode:active{border-color:#d6e4ff}#loader{z-index:100000;color:#262c57;background:#eceef6;flex-direction:column;justify-content:center;align-items:center;gap:14px;font-family:-apple-system,PingFang TC,Noto Sans TC,system-ui,sans-serif;transition:opacity .7s;display:flex;position:fixed;inset:0}#loader.done{opacity:0;pointer-events:none}#loader .logo{border-radius:20px;width:88px;height:88px;box-shadow:0 0 0 1px #262c5724}#loader .brand{letter-spacing:.15em;text-align:center;font-size:18px;font-weight:700;line-height:1.3}#loader .brand small{letter-spacing:.025em;color:#5b6189;margin-top:2px;font-size:12px;font-weight:400;display:block}#loader .city{letter-spacing:.04em;margin-top:6px;font-size:clamp(26px,5vw,44px);font-weight:800}#loader .bar{background:#262c571f;border-radius:2px;width:min(360px,60vw);height:4px;overflow:hidden}#loader .fill{background:#0d766a;width:0%;height:100%;transition:width .25s}#loader .step{color:#5b6189;min-height:1.4em;font-size:12px}</style>
    <script type="module" crossorigin src="./assets/index-CXSaMLyJ.js"></script>
  </head>
  <body>
    <div id="loader">
      <!-- Along the Line: the game's logo and name, not Tokyo's (decision 152) -->
      <img class="logo" src="./assets/ui/brand-mark.png" alt="" />
      <div class="brand">沿線<small>Along the Line</small></div>
      <div class="city"></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="step"></div>
    </div>
    <script>
      // The city's name goes on the loading screen before anything else runs, so it never changes under the eye.
      (function () {
        var id = new URLSearchParams(location.search).get('area') || 'tokyo', name = null;
        try { name = localStorage.getItem('procedural-tokyo:name:' + id); } catch (e) {}
        // Along the Line: the app's areas by their names (the app's page has a new origin, and so no storage, each time)
        name = name || { kaohsiung: '高雄車站', taichung: '臺中車站' }[id];
        document.querySelector('#loader .city').textContent = name || id.charAt(0).toUpperCase() + id.slice(1);
      })();
    </script>
    <!-- the info panel: hidden until asked for (control panel: info panel) -->
    <div id="hud" style="display: none">loading…</div>
    <button id="mode" type="button" aria-label="Switch between the photorealistic city and the abstract model"></button>
    <div id="credits"></div>
    <script>
      // The atmosphere works out its tables (the sky's colours, the light on the clouds) in the browser's idle
      // time, of which a busy page — the whole city loaded, clouds on — has none: the sky would stay dull and the
      // clouds dark for as long as it is busy. Idle work is given a deadline, so that it is done all the same.
      // (Here, before the modules: the library takes hold of the function when it is loaded.)
      if (window.requestIdleCallback) {
        const idle = window.requestIdleCallback.bind(window);
        window.requestIdleCallback = (callback, options) => idle(callback, { timeout: 30, ...options });
      }
    </script>
  </body>
</html>
