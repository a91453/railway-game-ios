# XcodeGen spec for the native iPhone / iPad app.
#
# The generated RailwayGame.xcodeproj is NOT committed. Regenerate it on a Mac
# (or let CI do it) from the repository root with:
#
#   xcodegen generate --spec RailwayGameApp/project.yml
#
# CI pins the XcodeGen version in .github/actions/setup-xcodegen/action.yml.
# Paths below are relative to this file.
name: RailwayGame

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  # The repository root is the Swift package that provides GameCore.
  RailwayGame:
    path: ..

targets:
  RailwayGame:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Views
    dependencies:
      - package: RailwayGame
        product: GameCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.a91453.RailwayGame
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Railway Game
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
