# XcodeGen spec for the native iPhone / iPad app.
#
# This file is the source of all project settings. The RailwayGame.xcodeproj
# generated from it IS committed (Xcode Cloud needs the project and its shared
# scheme in the repository). After changing this file, regenerate from the
# repository root and commit both:
#
#   xcodegen generate --spec RailwayGameApp/project.yml
#
# Use the XcodeGen version pinned in .github/actions/setup-xcodegen/action.yml
# (on Linux, build that release from source as CLAUDE.md describes), in a
# checkout directory named railway-game-ios: the directory name ends up in the
# project. ios-build.yml fails if the committed project differs from a fresh
# generation. Never edit the .xcodeproj by hand or in Xcode's project editor.
# Paths below are relative to this file.
name: RailwayGame

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  # The repository root is the Swift package that provides GameCore.
  RailwayGame:
    path: ..
  # MapLibre Native draws the OpenStreetMap base map of real-world maps
  # (ARCHITECTURE decision 97; BSD 2-Clause, its licence and notices in
  # Resources/Licenses). The binary distribution, pinned to one release.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0

targets:
  RailwayGame:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Views
      - path: Resources
        excludes:
          - "CityView/**"
      # Decision 152: the 3D city view's web page (built from Web/CityView by
      # tools/procedural-city/build_city_view.sh), copied as one folder so its
      # relative paths (assets/, textures/, tiles/) stay as they are.
      - path: Resources/CityView
        type: folder
        buildPhase: resources
    dependencies:
      - package: RailwayGame
        product: GameCore
      - package: RailwayGame
        product: GamePresentation
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.a91453.RailwayGame
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Automatic signing; Xcode Cloud manages the certificates and
        # profiles, so none are committed. DEVELOPMENT_TEAM, the 10-character
        # Team ID of the Apple Developer Program team (an identifier, not a
        # secret), stays unset until that team exists: Simulator builds and
        # the unsigned CI archive do not need it. To set it, add
        # `DEVELOPMENT_TEAM: <Team ID>` here and regenerate; do not pick the
        # team in Xcode's Signing & Capabilities pane, which would edit the
        # generated project. See docs/XCODE_CLOUD_ONBOARDING.md.
        CODE_SIGN_STYLE: Automatic
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        # The app's tint: the AccentColor asset, Theme.primary (Views/Theme.swift).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Along the Line
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        # Decision 106: a phone plays on its side, as builder games do.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  RailwayGameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RailwayGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.a91453.RailwayGameUITests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"

schemes:
  RailwayGame:
    build:
      targets:
        RailwayGame: all
        # Keep the UI runner out of Release archives and ordinary app builds.
        RailwayGameUITests: [test]
    test:
      config: Debug
      targets:
        - RailwayGameUITests
