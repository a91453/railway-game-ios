<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>綠色三節都市軌道車</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceef6;color:#262c57;font:15px system-ui}header{padding:18px 24px;background:white}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6;margin:8px 0}button,input,select,a{font:inherit}button,select,input{border:1px solid #adb3c7;border-radius:8px;padding:8px;background:white;color:#262c57}button,a{cursor:pointer}button:hover{background:#e2f1ed}main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding:16px}aside,section{background:white;border-radius:14px;padding:16px;min-width:0}aside{max-height:calc(100vh - 155px);overflow:auto;position:sticky;top:12px}#search,#category,#system{width:100%;margin-bottom:8px}#list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.tile{padding:6px;font-size:12px;overflow-wrap:anywhere}.tile img{width:100%;height:85px;object-fit:contain}.tile[aria-pressed=true]{outline:2px solid #0d766a}#stage{background:#dce9da;overflow:hidden;border-radius:10px}canvas{width:100%;height:auto;display:block;touch-action:none}.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}#name{font-size:23px;margin:0}#details{overflow-wrap:anywhere}a{color:#0d766a}#zoom{width:150px;padding:0}#status{min-height:24px}.tag{background:#e2f1ed;padding:4px 8px;border-radius:6px}#ports{font-size:13px}@media(max-width:720px){main{grid-template-columns:1fr;padding:8px}aside{position:static;max-height:320px}#list{grid-template-columns:repeat(4,1fr)}.tile img{height:60px}header{padding:14px}h1{font-size:21px}}
</style>
<header><h1>綠色三節都市軌道車</h1><p id="count"></p><p>三節可組合的靜態原生通勤車組；每節有兩組雙軸轉向架，提供各節與整組七向預覽。</p></header>
<main><aside><input id="search" aria-label="搜尋素材" placeholder="搜尋素材或 ID"><select id="category" aria-label="素材分類"><option value="all">全部素材</option><option value="section">單節模型</option><option value="formation">完整編組</option><option value="comparison">既有車輛對照</option></select><select id="system" aria-label="路網" hidden><option value="all">全部路網</option></select><div id="list"></div></aside>
<section><h2 id="name"></h2><p id="details"></p><div id="stage"><canvas id="canvas" width="900" height="620" aria-label="可旋轉的原生 3D 模型"></canvas></div><div class="row" id="views"></div><div class="row"><label>縮放 <input id="zoom" type="range" min="0.65" max="2" value="1" step="0.05"></label><select id="background" aria-label="預覽底色"><option value="#dce9da">地圖淺底</option><option value="#263c40">地圖深底</option><option value="#ffffff">面板淺底</option><option value="#262c57">面板深底</option></select><a id="zip" href="asset-package.zip" download>下載完整 ZIP</a><button id="png">下載目前 PNG</button><a id="glb" download>下載 GLB</a><a id="native" download>下載原生模型</a></div><div id="ports"></div><p id="status" role="status"></p><p>拖曳旋轉。模型為靜態素材。原生公尺尺寸，輪底貼地；此素材尚未綁定列車營運類型。</p></section></main>
<script type="module">
import {NativeRenderer} from './renderer.js';
const $=id=>document.getElementById(id),response=await fetch('manifest.json');if(!response.ok)throw Error('無法讀取清單');
window.manifest=await response.json();window.renderer=new NativeRenderer($('canvas'));let requestNumber=0,angle=-0.6,elevation=0.65,view='isometric',custom=false;
const labels={top:'上視',bottom:'下視',left:'左視',right:'右視',front:'前視',back:'後視',isometric:'立體'};
function draw(){renderer.render(view,{width:900,height:620,zoom:Number($('zoom').value),vector:custom?[Math.cos(angle)*Math.cos(elevation),Math.sin(angle)*Math.cos(elevation),Math.sin(elevation)]:undefined});}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();}
window.loadAsset=async id=>{const asset=manifest.models.find(m=>m.id===id);if(!asset)throw Error('未知素材');const serial=++requestNumber;const r=await fetch(asset.native);if(!r.ok)throw Error('無法讀取模型');const buffer=await r.arrayBuffer();if(serial!==requestNumber)return;renderer.load(buffer);window.currentAsset=asset;$('name').textContent=asset.name;$('details').textContent=(asset.system?asset.system+' · '+asset.lines.join(' / ')+' · ':'')+(asset.planned?'規劃路線 · ':'')+(asset.fidelity==='catalog-archetype'?'一般遊戲站型':asset.fidelity==='remixed-landmark-exterior'?'代表站外觀重組':asset.category==='comparison'?'既有車輛對照':'新增綠色三節都市軌道車');$('details').textContent+=' · '+asset.triangles+' 三角形 · '+asset.maximum.map((v,i)=>(v-asset.minimum[i]).toFixed(3)).join(' × ')+' m';$('ports').textContent=asset.connectors?'安裝面：'+asset.mount+'；接點：'+asset.connectors.map(c=>c.name+' ['+c.position.join(', ')+']').join('、'):'';$('glb').href=asset.glb;$('native').href=asset.native;document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.id===id)));custom=false;view='isometric';draw();$('status').textContent='';};
function filter(){const query=$('search').value.trim().replaceAll('臺','台').toLowerCase(),category=$('category').value,system=$('system').value;const filtered=manifest.models.filter(m=>(category==='all'||m.category===category)&&(system==='all'||m.system===system)&&(m.name+' '+m.id+' '+(m.system||'')).replaceAll('臺','台').toLowerCase().includes(query));$('list').replaceChildren(...filtered.map(m=>{const b=document.createElement('button');b.className='tile';b.dataset.id=m.id;b.setAttribute('aria-pressed',String(window.currentAsset?.id===m.id));const i=document.createElement('img');i.src=m.views.isometric;i.loading='lazy';i.alt='';b.append(i,document.createTextNode(m.name));b.onclick=()=>loadAsset(m.id).catch(showError);return b;}));}
function showError(e){$('status').textContent=e.message;}
for(const [key,label] of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.view=key;b.onclick=()=>{custom=false;view=key;draw();};$('views').append(b);}
for(const sys of [...new Set(manifest.models.map(m=>m.system).filter(Boolean))].sort()){const o=document.createElement('option');o.value=sys;o.textContent=sys;$('system').append(o);}
$('count').textContent='3 節單元 + 1 組完整編組 + 2 既有車輛對照 · 42 張七向透明圖';
for(const id of ['search','category','system'])$(id).addEventListener(id==='search'?'input':'change',filter);
$('zoom').oninput=draw;$('background').onchange=()=>$('stage').style.background=$('background').value;$('png').onclick=()=>download(renderer.png(),currentAsset.id+'-'+view+'.png');
let dragging;
$('canvas').onpointerdown=e=>{dragging=[e.clientX,e.clientY];$('canvas').setPointerCapture(e.pointerId);};
$('canvas').onpointermove=e=>{if(!dragging)return;angle+=(e.clientX-dragging[0])*0.008;elevation=Math.max(-1.45,Math.min(1.45,elevation-(e.clientY-dragging[1])*0.008));dragging=[e.clientX,e.clientY];custom=true;draw();};
$('canvas').onpointerup=()=>dragging=null;$('canvas').onpointercancel=()=>dragging=null;
filter();await loadAsset('urban-three-formation');
</script></html>
