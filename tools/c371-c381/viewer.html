<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C371／C381 捷運電聯車｜原生 3D 素材檢視器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceef6;color:#262c57;font:15px system-ui,sans-serif}header{background:#fff;padding:16px 24px}h1{font-size:24px;margin:0 0 6px}p{line-height:1.5;margin:6px 0}main{display:grid;grid-template-columns:minmax(220px,290px) minmax(0,1fr);gap:14px;padding:14px}aside,section{background:#fff;border-radius:12px;padding:14px;min-width:0}aside{max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:12px}button,input,select,a{font:inherit}button,select,input{border:1px solid #a5b4c3;border-radius:8px;padding:8px;background:#fff;color:#262c57}button,a{cursor:pointer}button:hover,a:hover{background:#e2f1ed}a{display:inline-block;color:#135d56;text-decoration:none;border:1px solid #a5b4c3;border-radius:8px;padding:8px}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #12a08f;outline-offset:2px}#search,#category{width:100%;margin-bottom:8px}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.tile{font-size:12px;overflow-wrap:anywhere;padding:5px;text-align:center}.tile img{display:block;width:100%;height:76px;object-fit:contain}.tile[aria-pressed=true]{outline:2px solid #0d766a}#stage{background:#dce9da;overflow:hidden;border-radius:10px}canvas{width:100%;height:auto;display:block;touch-action:none}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}#name{font-size:22px;margin:0}#details{overflow-wrap:anywhere}#zoom{width:160px;padding:0}#status{min-height:24px}#view-buttons button[aria-pressed=true]{background:#b9e6dd;border-color:#0d766a}@media(max-width:720px){main{grid-template-columns:1fr;padding:8px}aside{position:static;max-height:280px}#list{grid-template-columns:repeat(4,minmax(0,1fr))}.tile img{height:55px}header{padding:14px}h1{font-size:21px}}
</style>
<header><h1>C371／C381 捷運電聯車</h1><p id="count">正在讀取素材清單…</p><p>獨立單元與完整四節編組的靜態原生模型。無真實商標；尺寸來源與外觀限制請見隨包說明。</p></header>
<main><aside><input id="search" aria-label="搜尋素材" placeholder="搜尋單元或編組"><select id="category" aria-label="素材分類"><option value="all">全部素材</option><option value="section">獨立單元</option><option value="formation">完整編組</option><option value="comparison">風格對照</option></select><div id="list"></div></aside>
<section><h2 id="name"></h2><p id="details"></p><div id="stage"><canvas id="canvas" width="900" height="620" aria-label="可拖曳旋轉的 C371／C381 原生 3D 模型"></canvas></div><div class="row" id="view-buttons" aria-label="固定視角"></div><div class="row"><label for="zoom">縮放</label><input id="zoom" type="range" min="0.65" max="2.5" value="1" step="0.05"><select id="background" aria-label="預覽底色"><option value="#dce9da">地圖淺底</option><option value="#263c40">地圖深底</option><option value="#ffffff">面板淺底</option><option value="#262c57">面板深底</option></select></div><div class="row"><button id="png">下載目前 PNG</button><a id="glb" download>下載 GLB</a><a id="native" download>下載原生模型</a><a id="zip" href="asset-package.zip" download>下載完整 ZIP</a></div><p id="status" role="status"></p><p>拖曳模型旋轉，或選擇固定視角。這裡以最後一版原生頂點顯示，對應 GLB 可直接下載；兩者的逐頂點一致性由素材驗證紀錄確認。此為靜態素材預覽，未驗證真機 Metal、動畫或碰撞。</p></section></main>
<script type="module">
import {NativeRenderer} from './renderer.js';
const $=id=>document.getElementById(id),labels={top:'上視',bottom:'下視',left:'左視',right:'右視',front:'前視',back:'後視',isometric:'立體'};
const unitNames={'c371-dm':'DM 駕駛馬達車','c371-t':'T 拖車','c371-m':'M 馬達車','c371-rear':'DM 後端（已轉向）','c371-formation':'C371 六輛編組','c381-dm':'C381 DM 駕駛馬達車','c381-t':'C381 T 拖車','c381-m':'C381 M 馬達車','c381-rear':'C381 DM 後端','c381-formation':'C381 六輛編組','emu3000-ed':'EMU3000 霧面／遊戲色票對照'};
let manifest,currentAsset,requestNumber=0,angle=-0.6,elevation=0.65,view='isometric',custom=false,dragging;
const renderer=new NativeRenderer($('canvas'));window.renderer=renderer;
function draw(){if(!currentAsset)return;renderer.render(view,{width:900,height:620,zoom:Number($('zoom').value),vector:custom?[Math.cos(angle)*Math.cos(elevation),Math.sin(angle)*Math.cos(elevation),Math.sin(elevation)]:undefined});document.querySelectorAll('#view-buttons button').forEach(b=>b.setAttribute('aria-pressed',String(!custom&&b.dataset.view===view)));}
function category(m){return m.category==='formation'?'formation':m.category==='comparison'?'comparison':'section';}
function displayName(m){return unitNames[m.id]||m.name||m.id;}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();}
function showError(error){$('status').textContent=error.message;}
window.loadAsset=async id=>{const asset=manifest.models.find(m=>m.id===id);if(!asset)throw Error('未知素材：'+id);const serial=++requestNumber;const response=await fetch(asset.native);if(!response.ok)throw Error('無法讀取原生模型：'+asset.native);const buffer=await response.arrayBuffer();if(serial!==requestNumber)return;renderer.load(buffer);currentAsset=asset;window.currentAsset=asset;$('name').textContent=displayName(asset);$('details').textContent=(category(asset)==='formation'?'完整編組':category(asset)==='comparison'?'既有車輛風格對照':'獨立單元')+' · '+asset.triangles+' 個三角形'+(asset.minimum&&asset.maximum?' · 長 '+(asset.maximum[0]-asset.minimum[0]).toFixed(2)+' m':'');$('glb').href=asset.glb;$('native').href=asset.native;document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.id===id)));custom=false;view='isometric';$('zoom').value='1';draw();$('status').textContent='';};
function filter(){const query=$('search').value.trim().replaceAll('臺','台').toLowerCase(),cat=$('category').value;const models=manifest.models.filter(m=>(cat==='all'||category(m)===cat)&&(displayName(m)+' '+m.name+' '+m.id).replaceAll('臺','台').toLowerCase().includes(query));$('list').replaceChildren(...models.map(m=>{const button=document.createElement('button');button.className='tile';button.dataset.id=m.id;button.setAttribute('aria-pressed',String(currentAsset?.id===m.id));const image=document.createElement('img');image.src=m.views.isometric;image.loading='lazy';image.alt='';button.append(image,document.createTextNode(displayName(m)));button.onclick=()=>loadAsset(m.id).catch(showError);return button;}));}
for(const [key,label] of Object.entries(labels)){const button=document.createElement('button');button.textContent=label;button.dataset.view=key;button.setAttribute('aria-pressed','false');button.onclick=()=>{custom=false;view=key;draw();};$('view-buttons').append(button);}
$('search').oninput=filter;$('category').onchange=filter;$('zoom').oninput=draw;$('background').onchange=()=>$('stage').style.background=$('background').value;$('png').onclick=()=>{if(currentAsset)download(renderer.png(),currentAsset.id+'-'+view+'.png');};
$('canvas').onpointerdown=e=>{dragging=[e.clientX,e.clientY];$('canvas').setPointerCapture(e.pointerId);};
$('canvas').onpointermove=e=>{if(!dragging)return;angle+=(e.clientX-dragging[0])*0.008;elevation=Math.max(-1.45,Math.min(1.45,elevation-(e.clientY-dragging[1])*0.008));dragging=[e.clientX,e.clientY];custom=true;draw();};
$('canvas').onpointerup=()=>dragging=null;$('canvas').onpointercancel=()=>dragging=null;
try{const response=await fetch('manifest.json');if(!response.ok)throw Error('無法讀取素材清單');manifest=await response.json();window.manifest=manifest;$('count').textContent=manifest.models.filter(m=>category(m)==='section').length+' 種獨立單元 + '+manifest.models.filter(m=>category(m)==='formation').length+' 組完整編組 · 每模型七向透明圖';filter();await loadAsset(manifest.models.find(m=>category(m)==='formation')?.id||manifest.models[0].id);}catch(error){showError(error);}
</script>
</html>
