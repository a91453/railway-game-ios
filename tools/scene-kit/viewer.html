<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沿線｜原生 3D 素材</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eceef6;color:#262c57;font:15px/1.6 system-ui}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:30px}button,select,input{font:inherit;min-height:44px;border:1px solid #b4b9d9;background:white;color:#262c57;border-radius:9px;padding:8px 12px}button{cursor:pointer}button[aria-pressed=true]{border:2px solid #0d766a;color:#0d766a}a{color:#0d766a}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}.layout{display:grid;grid-template-columns:1fr 310px;gap:20px}.stage{border-radius:14px;overflow:hidden;background-color:#fff;background-image:repeating-conic-gradient(#eceef6 0 25%,#fff 0 50%);background-size:24px 24px;position:relative}canvas{width:100%;display:block;aspect-ratio:768/540;touch-action:none}.info{background:white;padding:18px;border-radius:14px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:24px}.tile{padding:8px;background:white;border:1px solid #c9cedf;border-radius:12px;text-align:left}.tile img{width:100%;aspect-ratio:1;object-fit:contain}.tile span{display:block;font-size:12px;overflow-wrap:anywhere}.note{color:#5b6189;font-size:13px}.six{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.six img{width:100%;background:#fff;border:1px solid #eceef6}.six a{font-size:12px}#status{min-height:24px}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #0d766a;outline-offset:2px}@media(max-width:800px){main{padding:16px}.layout{grid-template-columns:1fr}h1{font-size:24px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main>
<h1>台灣鐵道與城市｜原生 3D 素材</h1><p>同一個模型，從屋頂、底部與四側查看。拖曳旋轉，滾輪縮放。</p><div class="controls"><label>分類 <select id="category"><option value="all">全部</option></select></label><input id="search" type="search" placeholder="搜尋名稱或 ID" aria-label="搜尋模型"><label>模型 <select id="model"></select></label></div>
<div class="controls" id="directions"></div><div class="layout"><div><div class="stage"><canvas id="canvas" width="768" height="540" aria-label="可旋轉的 3D 模型預覽"></canvas></div><div class="controls"><label>縮放 <input id="zoom" type="range" min="0.5" max="2.5" step="0.05" value="1"></label><button id="png">下載目前視角 PNG</button><label>底色 <select id="background"><option value="#ffffff">淺色</option><option value="#262c57">深色</option></select></label></div><p id="status" role="status"></p></div><aside class="info"><h2 id="name"></h2><p id="details"></p><p><a id="glb">下載 GLB</a> · <a id="native">下載原生模型</a></p><div class="six" id="six"></div><h3>原圖片概念</h3><div id="concept" style="position:relative;overflow:hidden;max-width:180px;margin:auto"></div><p class="note">以同一題材重建量體、屋頂與細節，原圖不貼在模型上。</p><p class="note">六面圖片與可旋轉預覽均使用相同的實際原生頂點。WebGL 為檢視用途；iPhone 的 Metal 效果與效能需在裝置驗證。</p></aside></div><div class="gallery" id="gallery"></div><p class="note">材質為原生霧面頂點色，沒有私有原始模型、照片貼圖、品牌招牌或人臉。場景與列車尺寸為美術規劃，不改遊戲規則。</p><p><a href="README.md">使用與重建說明</a> · <a href="manifest.json">模型清單</a> · <a href="../index.html">原圖片素材</a></p>
<script type="module">
import {NativeRenderer,directions} from './renderer.js';
const $=id=>document.getElementById(id),labels={top:'上視',bottom:'下視',left:'左視',right:'右視',front:'前視',back:'後視',isometric:'立體'};
const manifest=await(await fetch('manifest.json')).json();window.manifest=manifest;
const renderer=new NativeRenderer($('canvas'));window.renderer=renderer;
let current,view='isometric',vector=null,loading=0;
function draw(){renderer.render(view,{zoom:Number($('zoom').value),vector});}
for(const [key,label] of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.view=key;b.setAttribute('aria-pressed',key===view);b.addEventListener('click',()=>{view=key;vector=null;for(const e of $('directions').children)e.setAttribute('aria-pressed',e===b);draw();});$('directions').append(b);}
const categories={railway:'鐵道',residential:'住宅',commercial:'商業',public:'公共建築',industrial:'工業物流',landscape:'公園綠地',props:'街景配件',ground:'道路鋪面'};
for(const [key,label] of Object.entries(categories))$('category').add(new Option(label,key));
async function load(id){const generation=++loading;const asset=manifest.models.find(m=>m.id===id);if(!asset)return;try{const response=await fetch(asset.native);if(!response.ok)throw Error('模型載入失敗');const bytes=await response.arrayBuffer();if(generation!==loading)return;renderer.load(bytes);current=asset;$('model').value=id;$('name').textContent=asset.name;$('details').textContent=`${asset.triangles.toLocaleString()} 個三角形 · ${asset.family} · ${(asset.maximum[0]-asset.minimum[0]).toFixed(1)} × ${(asset.maximum[1]-asset.minimum[1]).toFixed(1)} × ${(asset.maximum[2]-asset.minimum[2]).toFixed(1)} m`;
for(const format of ['glb','native']){$(format).href=asset[format];$(format).download=asset.id+(format==='glb'?'.glb':'.m3dmodel');}
$('concept').replaceChildren();if(asset.source_image){const f=asset.source_image.frame,host=$('concept');host.style.aspectRatio=f.width+'/'+f.height;if(f.clip_polygon)host.style.clipPath='polygon('+f.clip_polygon.map(([x,y])=>(x/f.width*100)+'% '+(y/f.height*100)+'%').join(',')+')';const image=document.createElement('img');image.alt='原圖片概念';image.src=asset.source_image.file;image.style.cssText='position:absolute;max-width:none;width:'+((f.x+f.width)/f.width*100)+'%';const sheetWidth=asset.source_image.width,sheetHeight=asset.source_image.height;image.style.width=sheetWidth/f.width*100+'%';image.style.height=sheetHeight/f.height*100+'%';image.style.left=-f.x/f.width*100+'%';image.style.top=-f.y/f.height*100+'%';host.append(image);}
$('six').replaceChildren();for(const d of ['top','bottom','left','right','front','back']){const a=document.createElement('a');a.href=asset.views[d];a.download=asset.id+'-'+d+'.png';const im=document.createElement('img');im.src=a.href;im.alt=labels[d];a.append(im,document.createTextNode(labels[d]));$('six').append(a);}draw();$('status').textContent=`已載入 ${asset.name}`;window.currentAsset=asset;}catch(e){$('status').textContent=e.message;throw e;}}
window.loadAsset=load;
function filter(){const q=$('search').value.toLowerCase(),cat=$('category').value,models=manifest.models.filter(a=>(cat==='all'||a.category===cat)&&(!q||(a.name+' '+a.id+' '+a.family).toLowerCase().includes(q)));$('model').replaceChildren();$('gallery').replaceChildren();for(const a of models){$('model').add(new Option(a.name,a.id));const b=document.createElement('button');b.className='tile';b.dataset.id=a.id;const im=document.createElement('img');im.src=a.views.isometric;im.alt='';im.loading='lazy';const s=document.createElement('span');s.textContent=a.name;b.append(im,s);b.addEventListener('click',()=>load(a.id));$('gallery').append(b);}if(current&&models.some(a=>a.id===current.id))$('model').value=current.id;else if(models.length)load(models[0].id);}
$('category').addEventListener('change',filter);$('search').addEventListener('input',filter);$('model').addEventListener('change',()=>load($('model').value));$('zoom').addEventListener('input',draw);$('background').addEventListener('change',()=>{$('canvas').parentElement.style.backgroundColor=$('background').value;$('canvas').parentElement.style.backgroundImage='none';});
$('png').addEventListener('click',()=>{const a=document.createElement('a');a.href=renderer.png();a.download=current.id+'-'+view+'.png';a.click();});
$('canvas').addEventListener('pointerdown',event=>{event.preventDefault();$('canvas').setPointerCapture(event.pointerId);const startX=event.clientX,startY=event.clientY;const initial=vector||directions[view],yaw=Math.atan2(initial[1],initial[0]),pitch=Math.asin(initial[2]/Math.hypot(...initial));const move=e=>{const a=yaw+(e.clientX-startX)*0.01,p=Math.max(-1.55,Math.min(1.55,pitch+(e.clientY-startY)*0.01));vector=[Math.cos(a)*Math.cos(p),Math.sin(a)*Math.cos(p),Math.sin(p)];for(const b of $('directions').children)b.setAttribute('aria-pressed','false');draw();};const end=()=>{$('canvas').removeEventListener('pointermove',move);$('canvas').removeEventListener('pointerup',end);$('canvas').removeEventListener('pointercancel',end);};$('canvas').addEventListener('pointermove',move);$('canvas').addEventListener('pointerup',end);$('canvas').addEventListener('pointercancel',end);});
$('canvas').addEventListener('wheel',event=>{event.preventDefault();$('zoom').value=Math.max(0.5,Math.min(2.5,Number($('zoom').value)-Math.sign(event.deltaY)*0.1));draw();},{passive:false});
filter();
</script></main></body></html>
