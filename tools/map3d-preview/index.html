layout(location=0) in vec3 position; layout(location=1) in vec3 normal; layout(location=2) in vec3 color; layout(location=3) in vec3 tex;

void main(){ vec4 p = viewProjection * vec4(position,1.0); p.z = 2.0*p.z - p.w; gl_Position = p;

const fs = `#version 300 es
precision highp float; precision highp sampler2DArray; precision highp sampler2DShadow;
uniform vec4 sunDirection, sunColor, ambientSky, ambientGround, fogColor, eye, fog, shade; uniform vec4 nightWindows[12]; uniform vec4 mirror, zenith, glint; uniform sampler2DArray surfaces; uniform int textured;
uniform mat4 sunMatrix; uniform vec4 sunShadow; uniform sampler2DShadow sunMap;
in vec3 vColor; in vec3 vNormal; in vec3 vWorld; in vec2 vUV; flat in float vLayer; flat in float vPlane; out vec4 outColor;
const float detailRepeat[4] = float[4](3.6, 1.8, 1.8, 1.8);
const vec2 glassMirror[24] = vec2[24](vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0.7,0), vec2(0.7,0),
 vec2(0.8,1), vec2(0,0), vec2(0.7,0), vec2(1,0), vec2(0,0), vec2(0.8,1), vec2(0.8,1), vec2(0.8,1), vec2(0.8,1), vec2(0.5,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0));
const vec4 rippleWaves[4] = vec4[4](vec4(0.92,0.39,1.1,0.3), vec4(-0.45,0.89,1.6,0.28), vec4(0.2,-0.98,2.7,0.22), vec4(-0.8,-0.6,4.3,0.14));
const vec2 rippleRuns[4] = vec2[4](vec2(1.1,0.0), vec2(-1.4,1.3), vec2(1.9,4.0), vec2(-2.6,0.0));
float hash12(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }

vec2 ripple(vec2 p, float t, float footprint){ vec2 bent = p + 2.0 * vec2(sin(p.y*0.11 + t*0.03), sin(p.x*0.11 - t*0.03 + 9.0)); vec2 slope = vec2(0.0);

  slope += w.xy * (w.w * w.z * cos(dot(w.xy, bent) * w.z + rippleRuns[i].x * t + rippleRuns[i].y) * kept); } return slope * 0.045; }
// Decision 370: map3dGridLine, and the street lights on the roads and the lit windows' yellow.
float gridLine(float t, float step){ float x = t / step; float w = fwidth(x); float d = abs(fract(x - 0.5) - 0.5); return 1.0 - smoothstep(0.0, max(w * 1.2, 1e-4), d - w * 0.15); }
const float ROAD_LAMP = 0.5; const vec2 ROAD_LAMP_SKY = vec2(0.50, 0.70); const vec3 WINDOW_WARM = vec3(1.0, 0.784, 0.420);
// Decision 357: map3dSunSeen (the GL texture's rows run up, so no flip).
float sunSeenAt(vec3 world, vec3 n){ if (sunShadow.x <= 0.0 || dot(n, sunDirection.xyz) <= 0.0) return 1.0;

 if (edge >= 1.0 || at.z <= 0.0 || at.z >= 1.0) return 1.0; vec2 uv = at.xy * 0.5 + 0.5; float t = sunShadow.y, d = at.z - sunShadow.w;
 float seen = texture(sunMap, vec3(uv + vec2(-t,-t), d)) + texture(sunMap, vec3(uv + vec2(t,-t), d)) + texture(sunMap, vec3(uv + vec2(-t,t), d)) + texture(sunMap, vec3(uv + vec2(t,t), d));

void main(){ vec3 n = normalize(vNormal); vec3 base = vColor; vec3 glow = vec3(0.0); float lights = shade.y;

 vec4 mirrored = vec4(0.0); bool mirrors = mirror.x > 0.0; vec3 toEye = normalize(eye.xyz - vWorld); float sunSeen = sunSeenAt(vWorld, n);
 if (mirrors && vLayer < -2.5 && vLayer > -3.5) { vec2 sl = ripple(vWorld.xz, mirror.y, length(fwidth(vWorld.xz))); n = normalize(vec3(-sl.x, 1.0, -sl.y)); sunSeen = sunSeenAt(vWorld, n);
  vec3 r = reflect(-toEye, n); float fr = 0.05 + 0.95 * pow(1.0 - max(dot(toEye, n), 0.0), 4.0);
  mirrored = vec4(seenToward(vec3(r.x, abs(r.y), r.z)), fr * mirror.x); float s = max(dot(r, sunDirection.xyz), 0.0);
  glow += glint.rgb * ((pow(s, 600.0) * 2.0 + pow(s, 60.0) * 0.2) * mirror.z * mirror.x * sunSeen); }

  vec2 pane = glassMirror[min(packed % 64, 23)]; vec3 tinted = base; if (pane.x > 0.6 && pane.y < 0.5) tinted = mix(tinted, vec3(0.80, 0.87, 0.93), 0.6);
  tinted *= mix(1.0, clamp(dot(t.rgb, vec3(0.2126, 0.7152, 0.0722)) * 2.0, 0.6, 1.2), 0.35); int material = packed / 64;
  if (material > 0) { int layer = material - 1; float metres = detailRepeat[min(layer - 18, 3)];

  if ((lights > 0.0 && rule.x > 0.0) || mirrorGlass > 0.0) {
   vec2 face = vec2(floor(vPlane / 4.0), dot(round(n * 4.0), vec3(1.0, 17.0, 289.0)));
   vec2 room = floor(vUV) + fract(face * vec2(0.1373, 0.2719)) * 512.0; float on = 0.0;
   if (lights > 0.0 && rule.x > 0.0) { float glass = (1.0 - t.a) * step(bright, rule.y);
    float busy = mix(0.5, 1.6, hash12(face * 0.37 + 11.0));
    on = step(1.0 - clamp(rule.x * busy, 0.0, 0.95), hash12(room + 23.0)) * glass;
    glow += WINDOW_WARM * mix(0.55, 1.1, hash12(room + 1.3)) * on * lights; }
   if (mirrorGlass > 0.0) {
    vec3 along = normalize(cross(vec3(0.0, 1.0, 0.0), n) + vec3(1e-4, 0.0, 0.0));
    vec3 tilted = normalize(n + (along * (hash12(room + 15.7) - 0.5) + vec3(0.0, hash12(room + 19.3) - 0.5, 0.0)) * 0.035);
    vec3 r = reflect(-toEye, tilted); float c = max(dot(toEye, tilted), 0.0);
    float fr = pane.y > 0.5 ? 0.18 + 0.62 * pow(1.0 - c, 5.0) : 0.1 + 0.9 * pow(1.0 - c, 4.0);
    vec3 seen = seenToward(r);
    if (lights > 0.0 && r.y < -0.015) { float reach = max(vUV.y, 0.3) * 3.2 / -r.y; vec2 g = (vWorld.xz + r.xz * reach) / 26.0, cell = floor(g);

     float spot = exp(-d * d / (3.0 + reach * 0.03)) * step(0.3, kind);
     vec3 tint = kind > 0.8 ? vec3(0.8, 0.9, 1.0) : (kind > 0.42 && kind < 0.5) ? vec3(1.0, 0.25, 0.2) : vec3(1.0, 0.72, 0.42);
     vec3 city = tint * spot * 5.0 / (1.0 + reach * reach / 4.0e5) + vec3(1.0, 0.75, 0.5) * 0.035 * smoothstep(0.0, 900.0, reach);
     glow += city * fr * mirrorGlass * lights * (1.0 - on * 0.9) * mirror.x; }
    mirrored = vec4(seen, fr * mirrorGlass * (1.0 - 0.85 * lights * on) * mirror.x);
    float s = max(dot(r, sunDirection.xyz), 0.0); float gl = pow(s, 1400.0) * 3.0 + pow(s, 90.0) * 0.35 + pow(s, 7.0) * 0.1;
    glow += glint.rgb * (gl * mirrorGlass * step(0.0, dot(n, sunDirection.xyz)) * mirror.z * mirror.x * sunSeen); } } }

out vec2 vAt; out vec3 vWorld; flat out vec3 vNormal; flat out float vKind, vPicture, vSeed, vAspect, vLit; flat out vec3 vBoard, vLetters;
vec3 unpack(float p){ return vec3(mod(p,256.0), mod(floor(p/256.0),256.0), floor(p/65536.0))/255.0; }
void main(){ vec2 at = vec2((gl_VertexID & 1) != 0 ? 1.0 : 0.0, (gl_VertexID & 2) != 0 ? 1.0 : 0.0);

const signFS = `#version 300 es
precision highp float;
uniform vec4 sunDirection, sunColor, ambientSky, ambientGround, fogColor, eye, fog, shade, clock; uniform sampler2D atlas;
in vec2 vAt; in vec3 vWorld; flat in vec3 vNormal; flat in float vKind, vPicture, vSeed, vAspect, vLit; flat in vec3 vBoard, vLetters; out vec4 outColor;
vec3 poster(float index, vec2 at){ float i=floor(index+0.5); vec2 cell=vec2(mod(i,8.0), floor(i/8.0)); return texture(atlas,(cell+clamp(vec2(at.x,1.0-at.y),0.004,0.996))/8.0).rgb; }

 vec2 f = aspect > shape ? vec2((at.x-0.5)*aspect/shape+0.5, at.y) : vec2(at.x, (at.y-0.5)*shape/aspect+0.5);

void main(){ vec3 n = vNormal; vec2 at = vAt; if (dot(n, eye.xyz - vWorld) < 0.0) { n = -n; at.x = 1.0 - at.x; }
 int kind = int(vKind+0.5); float lights = shade.y; vec3 colour, base, glow;
 if (kind == 1) { float t = clock.x*0.16 + vSeed*9.0, wipe = smoothstep(0.86,1.0,fract(t)); float now = mod(vPicture+floor(t),24.0), next = mod(now+1.0,24.0);
  colour = mix(poster(now,at), poster(next,at), step(at.x,wipe)); vec2 led = fract(at*vec2(160.0,90.0)); float fine = max(fwidth(at.x*160.0), fwidth(at.y*90.0));

 else { float i = floor(vPicture+0.5), strip = mod(i,4.0), across = kind == 3 ? 1.0 : 0.0, index = (kind == 3 ? 32.0 : 48.0) + floor(i/4.0);
  vec2 origin = vec2(mod(index,8.0), floor(index/8.0))/8.0 + vec2(1.0-across, across)*(strip/32.0); vec2 size = kind == 3 ? vec2(0.125,0.03125) : vec2(0.03125,0.125);

 float sun = max(dot(n, sunDirection.xyz), 0.0); vec3 ambient = mix(ambientGround.rgb, ambientSky.rgb, n.y*0.5+0.5); vec3 lit = base*(ambient + sunColor.rgb*sun);
